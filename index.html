<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9aa2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="하루">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<title>하루</title>
<style>
:root{--pink:#ff9aa2;--pl:#fff0f1;--pm:#ffd6d9;--pd:#d96b75;--text:#2d2326;--mu:#9e7e83;--hi:#c4a9ae;--bg:#fffcfc;--r:20px;--rs:12px;--nav:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none}
.app{max-width:430px;margin:0 auto;padding:0 20px calc(var(--nav)+env(safe-area-inset-bottom)+20px)}
.page{display:none}.page.active{display:block}

/* 로그인 화면 */
.auth-wrap{max-width:430px;margin:0 auto;padding:60px 28px 40px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.auth-logo{font-size:48px;text-align:center;margin-bottom:12px}
.auth-title{font-size:24px;font-weight:800;text-align:center;letter-spacing:-0.5px;margin-bottom:6px}
.auth-sub{font-size:14px;color:var(--mu);text-align:center;margin-bottom:40px}
.auth-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--pm)}
.auth-tab{flex:1;padding:10px;border:none;background:none;font-size:14px;font-weight:600;color:var(--hi);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.auth-tab.on{color:var(--pd);border-bottom-color:var(--pink)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-input{width:100%;border:1.5px solid var(--pm);border-radius:var(--rs);padding:13px 16px;font-size:15px;font-family:inherit;background:white;color:var(--text);outline:none}
.auth-input:focus{border-color:var(--pink)}
.auth-input::placeholder{color:var(--hi)}
.auth-btn{width:100%;padding:14px;background:var(--pink);color:white;border:none;border-radius:var(--rs);font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.auth-btn:active{opacity:.88}
.auth-btn:disabled{opacity:.45;cursor:not-allowed}
.auth-msg{font-size:13px;text-align:center;color:var(--mu);margin-top:8px;min-height:20px}
.auth-msg.err{color:#ef4444}
.auth-msg.ok{color:#10b981}

/* 메인 앱 */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top)+18px) 0 14px}
.hdr h1{font-size:21px;font-weight:700;letter-spacing:-0.5px}
.hdr .dt{font-size:12px;color:var(--mu);margin-top:2px}
.sp{display:flex;align-items:center;gap:4px;background:var(--pl);border:1px solid var(--pm);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--pd);white-space:nowrap;cursor:pointer}
.qc{background:#fff;border:1px solid rgba(255,154,162,.18);border-radius:var(--r);padding:26px 22px 20px;margin-bottom:12px;min-height:160px;position:relative;overflow:hidden}
.qc::before{content:open-quote;position:absolute;top:8px;left:14px;font-size:60px;line-height:1;color:var(--pm);font-family:Georgia,serif;pointer-events:none}
.qb{padding-top:20px}
.qt{font-size:16px;line-height:1.7;color:var(--text);word-break:keep-all}
.qt.ph{color:var(--hi);font-size:14px}
.qa{font-size:13px;color:var(--mu);margin-top:12px;font-weight:500}
.dots{display:flex;gap:6px;align-items:center;padding:16px 0}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--pm);animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ca{display:flex;gap:8px;margin-bottom:12px}
.ca button{flex:1;padding:10px 8px;border-radius:var(--rs);border:1.5px solid var(--pm);background:white;color:var(--mu);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.ca button:active{transform:scale(.97)}
.ca button.sv{color:var(--pd);border-color:var(--pink);background:var(--pl)}
.gb{width:100%;padding:14px;background:var(--pink);color:white;border:none;border-radius:var(--rs);font-size:16px;font-weight:700;cursor:pointer;margin-bottom:16px}
.gb:active{opacity:.88}.gb:disabled{opacity:.45;cursor:not-allowed}
.sc{background:white;border:1px solid rgba(255,154,162,.18);border-radius:var(--r);padding:18px 20px;margin-bottom:12px}
.sc .st{font-size:13px;font-weight:600;color:var(--pd);margin-bottom:12px}
.mr{display:flex;justify-content:space-between}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:2px solid transparent;border-radius:14px;padding:8px 6px;cursor:pointer;transition:all .15s;flex:1}
.mb .me{font-size:26px}.mb .ml{font-size:10px;color:var(--hi);font-weight:500}
.mb.sel{border-color:var(--pink);background:var(--pl)}.mb.sel .ml{color:var(--pd)}
.gl{display:flex;flex-direction:column;gap:8px}
.gi{width:100%;border:1px solid var(--pm);border-radius:var(--rs);padding:10px 12px;font-size:14px;font-family:inherit;background:var(--pl);color:var(--text);outline:none}
.gi:focus{border-color:var(--pink);background:white}
.gi::placeholder{color:var(--hi)}
.di{width:100%;border:1px solid var(--pm);border-radius:var(--rs);padding:10px 12px;font-size:14px;font-family:inherit;background:var(--pl);color:var(--text);outline:none;resize:none;line-height:1.6}
.di:focus{border-color:var(--pink);background:white}
.di::placeholder{color:var(--hi)}
.sr{display:flex;justify-content:flex-end;margin-top:10px}
.ssb{padding:7px 18px;border-radius:20px;border:1.5px solid var(--pink);background:white;color:var(--pd);font-size:13px;font-weight:600;cursor:pointer}
.syn{font-size:11px;color:var(--hi);text-align:right;margin-bottom:8px;min-height:16px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct{font-size:15px;font-weight:700}
.cn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--mu);padding:4px 8px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd{text-align:center;font-size:10px;color:var(--hi);font-weight:600;padding:4px 0}
.cc{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--mu);gap:1px}
.cc.td{background:var(--pl);color:var(--pd);font-weight:700}
.cc.om{opacity:.3;pointer-events:none}
.cc .ci{font-size:14px;line-height:1}
.cc .dot{display:none;width:5px;height:5px;border-radius:50%;background:var(--pink)}
.cc.hd .dot{display:block}
.dd{background:var(--pl);border:1px solid var(--pm);border-radius:var(--rs);padding:14px 16px;margin-top:10px;font-size:13px;line-height:1.7;display:none}
.dd.vis{display:block}
.dd .ddt{font-size:12px;color:var(--pd);font-weight:600;margin-bottom:8px}
.dd .dr{display:flex;gap:6px;margin-bottom:4px}
.dd .dl{color:var(--hi);min-width:40px}
.cht{font-size:13px;font-weight:600;color:var(--mu);margin-bottom:10px}
.cbs{display:flex;align-items:flex-end;gap:3px;height:80px}
.cbw{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.cb{width:100%;border-radius:6px 6px 0 0;background:var(--pm);min-height:4px}
.cb.fi{background:var(--pink)}
.cbl{font-size:9px;color:var(--hi)}
.ce{font-size:12px}
.si{background:white;border:1px solid rgba(255,154,162,.18);border-radius:var(--rs);padding:14px 16px;margin-bottom:10px}
.si .sit{font-size:14px;line-height:1.6;color:var(--text)}
.si .sim{font-size:11px;color:var(--hi);margin-top:6px}
.es{text-align:center;padding:50px 20px;color:var(--hi);font-size:14px;line-height:1.8}
.es .ei{font-size:40px;margin-bottom:10px}
.tn{position:fixed;bottom:0;left:0;right:0;z-index:200;background:white;border-top:1px solid var(--pm);display:flex;height:var(--nav);padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;font-size:10px;font-weight:500;color:var(--hi)}
.tb .ti{font-size:22px;line-height:1}
.tb.on{color:var(--pink)}
.toast{position:fixed;bottom:calc(var(--nav)+env(safe-area-inset-bottom)+12px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="authScreen" style="display:none">
  <div class="auth-wrap">
    <div class="auth-logo">🌱</div>
    <div class="auth-title">하루</div>
    <div class="auth-sub">매일 아침을 더 행복하게</div>
    <div class="auth-tabs">
      <button class="auth-tab on" id="tabLogin">로그인</button>
      <button class="auth-tab" id="tabSignup">회원가입</button>
    </div>
    <div class="auth-form">
      <input class="auth-input" id="authEmail" type="email" placeholder="이메일" autocomplete="email">
      <input class="auth-input" id="authPw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button class="auth-btn" id="authSubmit">로그인</button>
    </div>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="mainApp" style="display:none">
  <div class="app">
    <div class="page active" id="pgHome">
      <div class="hdr">

      <div class="qc"><div class="qb">

        </div>
      </div>
      <div class="sc" id="gratSec" style="display:none">

          <input class="gi" id="g1" placeholder="감사한 것 1" maxlength="60">
          <input class="gi" id="g2" placeholder="감사한 것 2" maxlength="60">
          <input class="gi" id="g3" placeholder="감사한 것 3" maxlength="60">
        </div>
        <div class="sr"><button class="ssb" id="btnGrat">저장</button></div>
      </div>
      <div class="sc" id="diarySec" style="display:none;margin-bottom:80px">
        <div class="st">오늘 하루 한 줄 일기 ✍️</div>
        <textarea class="di" id="diaryTxt" placeholder="오늘 하루를 한 줄로 표현하면?" maxlength="100" rows="2"></textarea>
        <div class="sr"><button class="ssb" id="btnDiary">저장</button></div>
      </div>
    </div>

    <div class="page" id="pgRecord">
      <div class="hdr">
        <h1>기록 📅</h1>
        <div class="sp">🔥 <span id="spNum2">0</span>일 연속</div>
      </div>
      <div class="sc">
        <div class="ch">
          <button class="cn" id="calPrev">&#8249;</button>
          <div class="ct" id="calTitle"></div>
          <button class="cn" id="calNext">&#8250;</button>
        </div>
        <div class="cg" id="calGrid"></div>
        <div class="dd" id="dayDetail"></div>
      </div>
      <div class="sc">
        <div class="cht">이번 달 기분 흐름 💭</div>
        <div class="cbs" id="moodChart"></div>
      </div>
    </div>

    <div class="page" id="pgSaved">
      <div class="hdr">
        <h1>저장한 명언 🔖</h1>
        <div class="sp">🔥 <span id="spNum3">0</span>일 연속</div>
      </div>
      <div id="savedList"></div>
    </div>
  </div>

  <nav class="tn">
    <button class="tb on" id="tabHome" data-tab="home"><span class="ti">🌱</span>오늘</button>
    <button class="tb" id="tabRecord" data-tab="record"><span class="ti">📅</span>기록</button>
    <button class="tb" id="tabSaved" data-tab="saved"><span class="ti">🔖</span>저장</button>
  </nav>
</div>

 당신이 그것을 어떻게 받아들이느냐가 당신을 괴롭힌다.", "author": "에픽테토스"}, {"quote": "부유한 것은 원하는 것을 많이 갖는 게 아니라, 적게 원하는 것이다.", "author": "에픽테토스"}, {"quote": "지금 이 순간 당신에게 닥친 모든 것은 반드시 이유가 있다.", "author": "마르쿠스 아우렐리우스"}, {"quote": "운명을 사랑하라. 당신에게 일어나는 모든 것을 원하라.", "author": "니체"}, {"quote": "자신을 극복하는 자가 가장 강한 자다.", "author": "니체"}, {"quote": "당신 안에 있는 혼돈에서 춤추는 별이 태어난다.", "author": "니체"}, {"quote": "우리는 고통을 통해서만 성장한다.", "author": "칼 융"}, {"quote": "그림자를 받아들이지 않으면 빛도 없다.", "author": "칼 융"}, {"quote": "당신이 무의식을 의식화하지 않으면, 무의식이 당신의 삶을 지배한다.", "author": "칼 융"}, {"quote": "존재한다는 것은 변화하는 것이고, 변화한다는 것은 성숙하는 것이다.", "author": "앙리 베르그송"}, {"quote": "철학의 시작은 놀라움이다.", "author": "아리스토텔레스"}, {"quote": "덕은 행동 속에 있다.", "author": "아리스토텔레스"}, {"quote": "교육의 목적은 즐거움을 올바른 것에서 찾는 법을 가르치는 것이다.", "author": "아리스토텔레스"}, {"quote": "나는 아무것도 모른다는 것을 안다.", "author": "소크라테스"}, {"quote": "검토되지 않은 삶은 살 가치가 없다.", "author": "소크라테스"}, {"quote": "강한 마음은 생각을 논하고, 평범한 마음은 사건을 논하고, 작은 마음은 사람을 논한다.", "author": "엘리너 루스벨트"}, {"quote": "아무도 당신의 동의 없이 당신을 열등하게 만들 수 없다.", "author": "엘리너 루스벨트"}, {"quote": "미래는 자신의 꿈의 아름다움을 믿는 자의 것이다.", "author": "엘리너 루스벨트"}, {"quote": "당신이 두려워하는 것을 매일 하라.", "author": "엘리너 루스벨트"}, {"quote": "지식은 힘이지만, 지혜는 그 힘을 올바르게 쓰는 것이다.", "author": "프랜시스 베이컨"}, {"quote": "읽는 것은 완전한 사람을 만들고, 쓰는 것은 정확한 사람을 만든다.", "author": "프랜시스 베이컨"}, {"quote": "희망은 좋은 아침 식사이지만, 나쁜 저녁 식사다.", "author": "프랜시스 베이컨"}, {"quote": "제자가 준비되면 스승이 나타난다.", "author": "불교 격언"}, {"quote": "배우고 때로 익히면 또한 기쁘지 아니한가.", "author": "공자"}, {"quote": "세 사람이 함께 걸으면 그 중에 반드시 나의 스승이 있다.", "author": "공자"}, {"quote": "아는 것을 안다 하고, 모르는 것을 모른다 하는 것, 이것이 앎이다.", "author": "공자"}, {"quote": "인생의 목표는 길을 아는 것이 아니라 걷는 것이다.", "author": "선 격언"}, {"quote": "당신이 가진 모든 것이 사라진다 해도 당신의 내면은 사라지지 않는다.", "author": "선 격언"}, {"quote": "생각이 고요해지면 세상이 보인다.", "author": "노자"}, {"quote": "물은 다투지 않지만 모든 것을 이긴다.", "author": "노자"}, {"quote": "아는 자는 말하지 않고, 말하는 자는 알지 못한다.", "author": "노자"}, {"quote": "천 리 길도 한 걸음부터.", "author": "노자"}, {"quote": "이미 일어난 일에 집착하지 마라. 아직 오지 않은 것을 걱정하지 마라.", "author": "석가모니"}, {"quote": "당신의 마음이 당신의 세계를 만든다.", "author": "석가모니"}, {"quote": "고통의 뿌리는 집착이다.", "author": "석가모니"}, {"quote": "당신이 화를 낸다면 당신은 이미 진 것이다.", "author": "석가모니"}, {"quote": "걷는 것은 기적이다. 숨 쉬는 것은 기적이다. 존재하는 것은 기적이다.", "author": "틱낫한"}, {"quote": "미소는 가장 쉬운 명상이다.", "author": "틱낫한"}, {"quote": "평화는 걷는 길이다. 평화로 가는 길은 없다.", "author": "틱낫한"}, {"quote": "당신이 세상을 돌보려면 먼저 자신을 돌봐야 한다.", "author": "틱낫한"}, {"quote": "당신의 상처가 치유되면, 그 자리가 가장 강한 곳이 된다.", "author": "헤밍웨이"}, {"quote": "글을 쓰는 것은 쉽다. 빈 종이 앞에 앉아 이마에서 피가 날 때까지 기다리면 된다.", "author": "헤밍웨이"}, {"quote": "태양은 항상 뜬다.", "author": "헤밍웨이"}, {"quote": "세상은 아름답고 싸울 가치가 있다.", "author": "헤밍웨이"}, {"quote": "인간은 파괴될 수 있어도 패배할 수 없다.", "author": "헤밍웨이"}, {"quote": "가장 어두운 곳에서 별이 가장 밝게 빛난다.", "author": "찰스 디킨스"}, {"quote": "결코 늦지 않았다. 새로운 시작을 위해.", "author": "조지 엘리엇"}, {"quote": "당신의 과거가 당신의 미래를 결정하지 않는다.", "author": "루이자 메이 올콧"}, {"quote": "사랑은 상대방의 성장을 원하는 것이다.", "author": "에리히 프롬"}, {"quote": "사랑은 기술이다. 배워야 한다.", "author": "에리히 프롬"}, {"quote": "인간은 자유를 선고받았다.", "author": "장폴 사르트르"}, {"quote": "존재는 본질에 앞선다.", "author": "장폴 사르트르"}, {"quote": "타인은 지옥이다. 그러나 타인 없이는 살 수 없다.", "author": "장폴 사르트르"}, {"quote": "당신의 삶을 예술 작품으로 만들어라.", "author": "알베르 카뮈"}, {"quote": "반항하는 것은 살아있다는 증거다.", "author": "알베르 카뮈"}, {"quote": "행복하기 위해서는 너무 많이 생각하지 말아야 한다.", "author": "알베르 카뮈"}, {"quote": "부조리를 인정하는 것이 자유의 시작이다.", "author": "알베르 카뮈"}, {"quote": "당신은 이미 답을 알고 있다. 그것을 믿어라.", "author": "파울로 코엘료"}, {"quote": "무언가를 간절히 원할 때, 온 우주가 당신 편이 된다.", "author": "파울로 코엘료"}, {"quote": "당신의 심장이 있는 곳에 보물이 있다.", "author": "파울로 코엘료"}, {"quote": "두려움은 당신이 꿈을 포기할 때 사라지지 않는다. 당신이 꿈을 향해 나아갈 때 사라진다.", "author": "파울로 코엘료"}, {"quote": "모든 인간에게는 자신의 이야기가 있다. 그것이 삶이다.", "author": "가브리엘 가르시아 마르케스"}, {"quote": "사랑은 모든 답이 아니라, 더 나은 질문을 하게 만드는 것이다.", "author": "가브리엘 가르시아 마르케스"}, {"quote": "당신이 원하는 것을 상상할 수 있다면, 그것을 이룰 수 있다.", "author": "윌리엄 아서 워드"}, {"quote": "습관은 우리가 된 것이고, 목표는 우리가 될 것이다.", "author": "제임스 클리어"}, {"quote": "1% 나아지는 것은 눈에 띄지 않지만, 매일 1% 나아지면 1년 후 37배 나아진다.", "author": "제임스 클리어"}, {"quote": "당신의 정체성이 당신의 행동을 결정한다.", "author": "제임스 클리어"}, {"quote": "목표가 아니라 시스템에 집중하라.", "author": "제임스 클리어"}, {"quote": "자존감은 당신이 성취한 것에서 오지 않고, 당신이 누구인지에서 온다.", "author": "브레네 브라운"}, {"quote": "취약함은 약함이 아니라 용기다.", "author": "브레네 브라운"}, {"quote": "온전히 살기 위해서는 온전히 느껴야 한다.", "author": "브레네 브라운"}, {"quote": "당신이 다른 사람에게 어떻게 대하는지가 당신이 어떤 사람인지를 보여준다.", "author": "브레네 브라운"}, {"quote": "비교는 기쁨을 훔치는 도둑이다.", "author": "브레네 브라운"}, {"quote": "진정한 자아실현은 다른 사람을 돕는 것에서 온다.", "author": "에이브러햄 매슬로"}, {"quote": "당신이 될 수 있는 것이 되어야 한다, 그렇지 않으면 평화롭지 않다.", "author": "에이브러햄 매슬로"}, {"quote": "행복은 목표가 아니라 부산물이다.", "author": "엘리너 루스벨트"}, {"quote": "두뇌는 근육이다. 쓸수록 강해진다."}, {"quote": "당신의 뇌는 당신이 믿는 것을 현실로 만들려 한다. 올바른 것을 믿어라."}, {"quote": "감정은 정보다. 그것을 억압하지 말고 들어라."}, {"quote": "회복력은 쓰러지지 않는 것이 아니라, 쓰러졌을 때 일어나는 능력이다."}, {"quote": "당신의 생각을 관찰하라. 당신은 생각이 아니다.", "author": "에크하르트 톨레"}, {"quote": "지금 이 순간을 받아들이는 것이 깨달음의 시작이다.", "author": "에크하르트 톨레"}, {"quote": "고통은 저항에서 온다. 받아들임이 치유다.", "author": "에크하르트 톨레"}, {"quote": "창의성은 연결이다. 점들을 연결하는 것.", "author": "스티브 잡스"}, {"quote": "단순함은 복잡함의 최고봉이다.", "author": "레오나르도 다 빈치"}, {"quote": "예술은 자연이 아니라 자연에 대한 반응이다.", "author": "에밀 졸라"}, {"quote": "예술의 목적은 일상을 아름답게 보이게 하는 것이다.", "author": "앤디 워홀"}, {"quote": "모든 아이는 예술가다. 문제는 어른이 되어서도 예술가로 남는 것이다.", "author": "파블로 피카소"}, {"quote": "나는 6년이 걸린 그림에서도, 6분이 걸린 그림에서도 같은 가격을 받는다. 6분이 아니라 평생이 걸린 것이니.", "author": "제임스 맥닐 휘슬러"}, {"quote": "영감은 존재한다. 하지만 일하는 당신을 찾아와야 한다.", "author": "파블로 피카소"}, {"quote": "당신이 만들 수 있다고 생각하는 것보다 더 많은 것을 만들 수 있다."}, {"quote": "완벽한 작품은 없다. 완성된 작품만 있을 뿐이다.", "author": "레오나르도 다 빈치"}, {"quote": "실수를 두려워하지 마라. 실수는 창의성의 연료다."}, {"quote": "상상력은 지식보다 중요하다.", "author": "알베르트 아인슈타인"}, {"quote": "삶은 자전거를 타는 것과 같다. 균형을 유지하려면 계속 움직여야 한다.", "author": "알베르트 아인슈타인"}, {"quote": "두 가지 방법으로 살 수 있다. 아무것도 기적이 아닌 것처럼, 또는 모든 것이 기적인 것처럼.", "author": "알베르트 아인슈타인"}, {"quote": "같은 행동을 반복하면서 다른 결과를 기대하는 것은 미친 짓이다.", "author": "알베르트 아인슈타인"}, {"quote": "지식보다 중요한 것은 상상력이고, 사실보다 중요한 것은 이야기다.", "author": "알베르트 아인슈타인"}, {"quote": "당신이 모르는 것을 배우려는 의지가 성장의 시작이다."}, {"quote": "호기심은 학습의 엔진이다."}, {"quote": "과학은 의심하는 것에서 시작된다.", "author": "리처드 파인만"}, {"quote": "당신이 이해할 수 없다면, 아직 충분히 단순하게 설명하지 못한 것이다.", "author": "리처드 파인만"}, {"quote": "거인의 어깨 위에 서서 나는 더 멀리 볼 수 있었다.", "author": "아이작 뉴턴"}, {"quote": "리더는 사람들이 가고 싶지 않은 곳으로 데려가는 사람이다.", "author": "로잘린 카터"}, {"quote": "가장 어두울 때 빛이 필요하다.", "author": "마틴 루터 킹"}, {"quote": "정의를 위한 싸움이 길어질 때, 우리는 절망하지 않고 희망을 선택한다.", "author": "마틴 루터 킹"}, {"quote": "지금 시작하지 않으면 언제 시작할 것인가.", "author": "마틴 루터 킹"}, {"quote": "불가능해 보이는 것이 가능해지는 순간은 당신이 시도할 때다.", "author": "넬슨 만델라"}, {"quote": "항상 불가능해 보이기 전까지는.", "author": "넬슨 만델라"}, {"quote": "나는 실패한 것이 아니다. 다만 효과없는 방법을 배웠을 뿐이다.", "author": "토마스 에디슨"}, {"quote": "천재는 1퍼센트의 영감과 99퍼센트의 땀으로 이루어진다.", "author": "토마스 에디슨"}, {"quote": "기회는 노력하는 자에게 온다.", "author": "토마스 에디슨"}, {"quote": "당신의 시간은 한정되어 있다. 다른 사람의 삶을 사느라 낭비하지 마라.", "author": "스티브 잡스"}, {"quote": "배고픔을 유지하라. 어리석음을 유지하라.", "author": "스티브 잡스"}, {"quote": "좋은 예술가는 모방하고, 위대한 예술가는 훔친다.", "author": "스티브 잡스"}, {"quote": "실패는 선택이 아니다. 성장은 선택이다."}, {"quote": "당신이 무엇을 하든, 잘 하라.", "author": "에이브러햄 링컨"}, {"quote": "준비할 시간을 준다면 나무를 베는 데 8시간이 걸리지 않는다.", "author": "에이브러햄 링컨"}, {"quote": "40살이 넘으면 자신의 얼굴에 책임을 져야 한다.", "author": "에이브러햄 링컨"}, {"quote": "당신이 올바른 방향으로 걷고 있다면, 계속 걸어라."}, {"quote": "결과보다 과정을 즐기는 자가 끝까지 간다."}, {"quote": "성공한 사람과 실패한 사람의 차이는 포기하는 시점이다."}, {"quote": "당신이 지금 힘든 이유는 아직 성장하고 있기 때문이다."}, {"quote": "우리는 사랑받기 위해 태어났고, 사랑하기 위해 살아간다.", "author": "빅토르 위고"}, {"quote": "진정한 우정은 건강과 같다. 잃어버리기 전에는 그 가치를 모른다.", "author": "찰스 칼렙 콜턴"}, {"quote": "당신 곁에 있으면 자연스럽게 더 나은 사람이 되고 싶어지는 사람을 곁에 두어라."}, {"quote": "사람은 사랑하는 사람을 닮아간다."}, {"quote": "진정한 사랑은 상대방이 자신이 될 수 있도록 자유를 주는 것이다.", "author": "에리히 프롬"}, {"quote": "우리가 서로를 필요로 하는 것이 우리를 인간으로 만든다."}, {"quote": "혼자 있을 수 있어야 함께할 수 있다."}, {"quote": "가장 아름다운 것은 함께 웃는 것이다."}, {"quote": "당신이 사랑하는 사람에게 오늘 그 마음을 전하라. 내일은 없을 수도 있다."}, {"quote": "깊이 사랑받으면 강해지고, 깊이 사랑하면 용감해진다.", "author": "노자"}, {"quote": "사람들은 당신이 한 말은 잊어버리지만, 당신이 그들을 어떻게 느끼게 했는지는 절대 잊지 않는다.", "author": "마야 안젤루"}, {"quote": "당신이 넘어질 때 일으켜주는 사람이 진짜 친구다."}, {"quote": "가장 강한 사람은 혼자 서 있을 수 있는 사람이지만, 가장 행복한 사람은 함께할 수 있는 사람이다."}, {"quote": "당신의 존재 자체가 누군가에게 충분한 이유가 된다."}, {"quote": "당신이 사랑받을 자격이 있다는 것을 결코 의심하지 마라."}, {"quote": "당신이 가진 것에 집중하면 더 많아지고, 없는 것에 집중하면 더 부족해진다.", "author": "오프라 윈프리"}, {"quote": "행복은 준비된 마음을 가진 자에게 찾아온다.", "author": "루이 파스퇴르"}, {"quote": "당신이 깨어있는 모든 순간은 선물이다."}, {"quote": "감사는 과거를 아름답게 하고, 현재를 충만하게 하며, 미래를 밝게 한다.", "author": "멜로디 비티"}, {"quote": "행복은 더 많은 것을 갖는 것이 아니라, 가진 것을 더 깊이 즐기는 것이다."}, {"quote": "작은 것에서 기쁨을 찾는 사람이 가장 풍요롭다."}, {"quote": "오늘 아침 눈을 뜬 것 자체가 이미 충분한 이유다."}, {"quote": "당신의 인생에서 가장 좋은 것들은 공짜다. 그리고 두 번째로 좋은 것들도."}, {"quote": "행복은 물건이 아니라 사람에게서 온다."}, {"quote": "당신이 지금 서 있는 이 순간, 당신은 충분하다."}, {"quote": "인생에서 가장 아름다운 날들은 아직 살지 않은 날들이다.", "author": "니코스 카잔차키스"}, {"quote": "당신의 삶에서 가장 행복했던 순간들은 계획되지 않은 것들이었다."}, {"quote": "오늘 하루를 충분히 살면 그것으로 충분하다."}, {"quote": "기쁨은 나누면 두 배가 되고, 슬픔은 나누면 반이 된다.", "author": "스웨덴 속담"}, {"quote": "당신 주변의 평범한 것들이 사실은 기적이다."}, {"quote": "당신이 무너진 곳에서 당신만의 새로운 것이 피어난다.", "author": "루미"}, {"quote": "치유는 선형이 아니다. 뒤로 가는 것도 앞으로 가는 것이다."}, {"quote": "당신의 상처는 당신의 이야기의 일부지만 전부가 아니다."}, {"quote": "부러진 뼈가 붙은 자리가 가장 단단하다.", "author": "어니스트 헤밍웨이"}, {"quote": "폭풍 속에서도 닻을 내릴 수 있는 사람이 진정 강한 사람이다."}, {"quote": "당신이 지금 느끼는 것들은 모두 일시적이다. 하지만 당신은 영원하다."}, {"quote": "새벽 세 시는 영혼의 어두운 밤이다. 하지만 새벽은 온다.", "author": "F. 스콧 피츠제럴드"}, {"quote": "당신이 넘어진 횟수보다 일어선 횟수가 하나 더 많으면 된다."}, {"quote": "끝은 새로운 시작이다."}, {"quote": "당신이 겪은 것이 당신을 망가뜨린 것이 아니라 단련시킨 것이다."}, {"quote": "비가 내린 후에 꽃이 핀다."}, {"quote": "당신이 힘들다면, 그것은 당신이 여전히 싸우고 있다는 뜻이다."}, {"quote": "강한 사람은 아무것도 느끼지 않는 사람이 아니라, 다 느끼면서도 계속 나아가는 사람이다."}, {"quote": "지금 이 순간의 고통이 당신을 더 깊은 사람으로 만든다."}, {"quote": "당신은 당신이 겪은 것보다 강하다."}, {"quote": "과거는 기억이고, 미래는 상상이다. 지금 이 순간만이 현실이다."}, {"quote": "당신이 지금 하는 일이 10년 후를 만든다."}, {"quote": "시간은 되돌릴 수 없다. 그러므로 지금 이 순간을 잘 쓰라."}, {"quote": "오늘 하루가 당신의 남은 인생 중 가장 젊은 날이다."}, {"quote": "지금 이 순간에 완전히 존재하는 것, 그것이 // ── Supabase Auth ──
var userToken = null;
var userId = null;
var streak = 0;
var calData = {};
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();

function getToday(){
  var n=new Date();
  var k=new Date(n.getTime()+9*60*60*1000);
  return k.toISOString().split('T')[0];
}

var kst = new Date(new Date().getTime()+9*60*60*1000);
document.getElementById('dtLabel').textContent = kst.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});

function sbFetch(path, method, body, token) {
  return fetch(SB_URL+'/rest/v1/'+path, {
    method: method||'GET',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer '+(token||userToken||SB_KEY),
      'Content-Type': 'application/json',
      'Prefer': method==='POST'?'resolution=merge-duplicates,return=minimal':'return=minimal'
    },
    body: body?JSON.stringify(body):undefined
  });
}

function authFetch(path, body) {
  return fetch(SB_URL+'/auth/v1/'+path, {
    method: 'POST',
    headers: {'apikey': SB_KEY, 'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
}

// ── 세션 관리 ──
function saveSession(session) {
  try {
    localStorage.setItem('haru_session', JSON.stringify({
      token: session.access_token,
      refresh: session.refresh_token,
      userId: session.user.id
    }));
  } catch(e) {}
}

function loadSession() {
  try {
    var s = JSON.parse(localStorage.getItem('haru_session')||'null');
    if(s && s.token) { userToken=s.token; userId=s.userId; return true; }
  } catch(e) {}
  return false;
}

function refreshSession() {
  try {
    var s = JSON.parse(localStorage.getItem('haru_session')||'null');
    if(!s || !s.refresh) return Promise.resolve(false);
    return fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: {'apikey': SB_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: s.refresh})
    }).then(function(r){return r.json();})
    .then(function(data){
      if(data.access_token){ saveSession(data); userToken=data.access_token; userId=data.user.id; return true; }
      return false;
    });
  } catch(e) { return Promise.resolve(false); }
}

// ── 로그인/회원가입 UI ──
var authMode = 'login';
document.getElementById('tabLogin').addEventListener('click', function(){
  authMode='login';
  document.getElementById('tabLogin').className='auth-tab on';
  document.getElementById('tabSignup').className='auth-tab';
  document.getElementById('authSubmit').textContent='로그인';
  document.getElementById('authMsg').textContent='';
});
document.getElementById('tabSignup').addEventListener('click', function(){
  authMode='signup';
  document.getElementById('tabLogin').className='auth-tab';
  document.getElementById('tabSignup').className='auth-tab on';
  document.getElementById('authSubmit').textContent='회원가입';
  document.getElementById('authMsg').textContent='';
});

document.getElementById('authSubmit').addEventListener('click', function(){
  var email = document.getElementById('authEmail').value.trim();
  var pw = document.getElementById('authPw').value.trim();
  var msg = document.getElementById('authMsg');
  if(!email||!pw){ msg.className='auth-msg err'; msg.textContent='이메일과 비밀번호를 입력해줘'; return; }
  var btn = document.getElementById('authSubmit');
  btn.disabled=true; btn.textContent='처리 중...';
  msg.className='auth-msg'; msg.textContent='';

  var endpoint = authMode==='login'?'token?grant_type=password':'signup';
  authFetch(endpoint, {email:email, password:pw})
  .then(function(r){return r.json();})
  .then(function(data){
    btn.disabled=false;
    btn.textContent=authMode==='login'?'로그인':'회원가입';
    if(data.access_token){
      saveSession(data);
      userToken=data.access_token;
      userId=data.user.id;
      showApp();
    } else if(authMode==='signup' && data.id) {
      msg.className='auth-msg ok';
      msg.textContent='가입 완료! 이메일 확인 후 로그인해줘';
    } else {
      msg.className='auth-msg err';
      msg.textContent=data.error_description||data.msg||'오류가 발생했어. 다시 시도해봐';
    }
  })
  .catch(function(){
    btn.disabled=false;
    btn.textContent=authMode==='login'?'로그인':'회원가입';
    msg.className='auth-msg err';
    msg.textContent='네트워크 오류. 다시 시도해봐';
  });
});

// 엔터키
[document.getElementById('authEmail'), document.getElementById('authPw')].forEach(function(el){
  el.addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('authSubmit').click(); });
});

// 로그아웃
document.getElementById('streakPill').addEventListener('click', function(){
  if(!confirm('로그아웃 할까?')) return;
  localStorage.removeItem('haru_session');
  userToken=null; userId=null;
  document.getElementById('mainApp').style.display='none';
  document.getElementById('authScreen').style.display='block';
});

function showApp() {
  document.getElementById('authScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  loadToday();
}

// ── 데이터 로드/저장 ──
function setSyn(msg){ var el=document.getElementById('synMsg'); if(el)el.textContent=msg||''; }

function renderStreak(){
  ['spNum','spNum2','spNum3'].forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=streak;});
}

function loadToday(){
  var td=getToday();
  sbFetch('haru_data?user_id=eq.'+userId+'&date=eq.'+td+'&select=*')
  .then(function(r){return r.json();})
  .then(function(rows){if(rows&&rows.length){applyData(rows[0]);}})
  .catch(function(){});
  sbFetch('haru_streak?user_id=eq.'+userId+'&select=*')
  .then(function(r){return r.json();})
  .then(function(rows){if(rows&&rows.length){streak=rows[0].streak||0;renderStreak();}})
  .catch(function(){});
}

function applyData(row){
  if(!row)return;
  if(row.mood){document.querySelectorAll('.mb').forEach(function(b){b.classList.toggle('sel',parseInt(b.dataset.mood)===row.mood);});}
  if(row.gratitude&&Array.isArray(row.gratitude)){
    document.getElementById('g1').value=row.gratitude[0]||'';
    document.getElementById('g2').value=row.gratitude[1]||'';
    document.getElementById('g3').value=row.gratitude[2]||'';
  }
  if(row.diary)document.getElementById('diaryTxt').value=row.diary;
}

function saveField(fields){
  var td=getToday();
  if(!userId){ toast('❌ 로그인 필요 userId:'+userId); return; }
  if(!userToken){ toast('❌ 토큰없음'); return; }
  toast('저장 중...');
  setSyn('저장 중...');
  var body=Object.assign({user_id:userId,date:td},fields);
  fetch(SB_URL+'/rest/v1/haru_data', {
    method:'POST',
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+userToken,
      'Content-Type':'application/json',
      'Prefer':'resolution=merge-duplicates,return=minimal'
    },
    body:JSON.stringify(body)
  }).then(function(r){
    if(r.ok){
      setSyn('✓ 저장됨');
      toast('✅ 저장됐어!');
      setTimeout(function(){setSyn('');},2000);
    } else {
      r.text().then(function(t){toast('POST실패:'+r.status+' '+t.substr(0,30));});
      // PATCH fallback
      return fetch(SB_URL+'/rest/v1/haru_data?user_id=eq.'+userId+'&date=eq.'+td,{
        method:'PATCH',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+userToken,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify(fields)
      }).then(function(r2){
        if(r2.ok){setSyn('✓ 저장됨');toast('✅ 저장됐어(PATCH)!');}
        else{r2.text().then(function(t){toast('PATCH실패:'+r2.status);});}
        setTimeout(function(){setSyn('');},2000);
      });
    }
  }).catch(function(e){setSyn('');toast('❌ 오류:'+e.message);});
}

function bumpStreak(){
  var td=getToday();
  var lastKey='haru_ld_'+userId;
  var lastDate=localStorage.getItem(lastKey)||'';
  if(lastDate===td)return;
  var yd=new Date(kst);yd.setDate(yd.getDate()-1);
  var ys=new Date(yd.getTime()).toISOString().split('T')[0];
  streak=lastDate===ys?streak+1:1;
  localStorage.setItem(lastKey,td);
  renderStreak();
  fetch(SB_URL+'/rest/v1/haru_streak',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+userToken,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({user_id:userId,streak:streak,last_date:td})
  }).catch(function(){});
}

// ── 명언 ──
var curQ='',curA='',loading=false;
function getRand(){return QUOTES[Math.floor(Math.random()*QUOTES.length)];}

function generate(){
  if(loading)return;
  loading=true;
  var btn=document.getElementById('btnGen');
  btn.disabled=true;btn.textContent='고르는 중...';
  document.getElementById('caRow').style.display='none';
  document.getElementById('btnSave').classList.remove('sv');
  document.getElementById('btnSave').textContent='🔖 저장';
  var qt=document.getElementById('qtText');
  var qa=document.getElementById('qaText');
  qt.className='qt';
  qt.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
  qa.style.display='none';
  setTimeout(function(){
    var p=getRand();
    if(!p){qt.textContent='다시 눌러봐.';qt.className='qt ph';loading=false;btn.disabled=false;btn.textContent='다시 받기';return;}
    curQ=p.quote||'';curA=p.author||'';
    qt.textContent='\u201C'+curQ+'\u201D';
    qt.className='qt';
    if(curA){qa.textContent='— '+curA;qa.style.display='block';}
    document.getElementById('caRow').style.display='flex';
    document.getElementById('moodSec').style.display='block';
    document.getElementById('gratSec').style.display='block';
    document.getElementById('diarySec').style.display='block';
    loadToday();bumpStreak();
    loading=false;btn.disabled=false;btn.textContent='다시 받기';
  },380);
}

document.getElementById('btnGen').addEventListener('click',generate);
document.getElementById('btnRegen').addEventListener('click',generate);
document.getElementById('btnSave').addEventListener('click',function(){
  if(!curQ)return;
  document.getElementById('btnSave').classList.add('sv');
  document.getElementById('btnSave').textContent='✅ 저장됨';
  fetch(SB_URL+'/rest/v1/haru_saved',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+userToken,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({user_id:userId,quote:curQ,author:curA,date:getToday()})
  }).then(function(){toast('저장했어 ✓');}).catch(function(){toast('저장 실패');});
});

document.getElementById('moodSec').addEventListener('click',function(e){
  var btn=e.target.closest('.mb');if(!btn)return;
  document.querySelectorAll('.mb').forEach(function(b){b.classList.remove('sel');});
  btn.classList.add('sel');
  saveField({mood:parseInt(btn.dataset.mood),mood_emoji:btn.dataset.emoji});
  toast('기분 저장 ✓');
});
document.getElementById('btnGrat').addEventListener('click',function(){
  var g=[
    document.getElementById('g1').value.trim(),
    document.getElementById('g2').value.trim(),
    document.getElementById('g3').value.trim()
  ];
  saveField({gratitude:g});toast('감사 3가지 저장 ✓');
});
document.getElementById('btnDiary').addEventListener('click',function(){
  var v=document.getElementById('diaryTxt').value.trim();
  if(!v){toast('내용을 입력해줘');return;}
  saveField({diary:v});
});

// ── 캘린더 ──
function loadCalData(y,m){
  var from=y+'-'+String(m+1).padStart(2,'0')+'-01';
  var to=y+'-'+String(m+1).padStart(2,'0')+'-31';
  sbFetch('haru_data?user_id=eq.'+userId+'&date=gte.'+from+'&date=lte.'+to+'&select=date,mood,mood_emoji,gratitude,diary')
  .then(function(r){return r.json();})
  .then(function(rows){calData={};if(rows)rows.forEach(function(r){calData[r.date]=r;});renderCal();})
  .catch(function(){renderCal();});
}

function renderCal(){
  var td=getToday();
  document.getElementById('calTitle').textContent=calYear+'년 '+(calMonth+1)+'월';
  var g=document.getElementById('calGrid');
  var h=['일','월','화','수','목','금','토'].map(function(d){return '<div class="cd">'+d+'</div>';}).join('');
  var first=new Date(calYear,calMonth,1).getDay();
  var last=new Date(calYear,calMonth+1,0).getDate();
  var pl=new Date(calYear,calMonth,0).getDate();
  for(var i=0;i<first;i++)h+='<div class="cc om">'+(pl-first+i+1)+'</div>';
  for(var d=1;d<=last;d++){
    var ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isT=ds===td;
    var row=calData[ds];
    var emoji=row?row.mood_emoji:null;
    var hasD=row&&(row.mood||row.diary||(row.gratitude&&row.gratitude.some(Boolean)));
    var cls='cc'+(isT?' td':'')+(hasD?' hd':'');
    var inner=emoji?'<span class="ci">'+emoji+'</span><span style="font-size:10px">'+d+'</span>':d;
    h+='<div class="'+cls+'" data-date="'+ds+'">'+inner+(hasD&&!emoji?'<span class="dot"></span>':'')+'</div>';
  }
  var rem=7-((first+last)%7);if(rem<7)for(var j=1;j<=rem;j++)h+='<div class="cc om">'+j+'</div>';
  g.innerHTML=h;
  g.querySelectorAll('.cc:not(.om)').forEach(function(c){c.addEventListener('click',function(){showDay(c.dataset.date);});});
  renderChart();
}

function showDay(ds){
  var det=document.getElementById('dayDetail');
  var row=calData[ds];if(!row){det.classList.remove('vis');return;}
  var p=[];
  if(row.mood_emoji)p.push('<div class="dr"><span class="dl">기분</span><span>'+row.mood_emoji+' '+['','힘들어','별로','보통','좋아','최고'][row.mood||0]+'</span></div>');
  if(row.gratitude&&row.gratitude.some(Boolean))row.gratitude.filter(Boolean).forEach(function(g,i){p.push('<div class="dr"><span class="dl">감사'+(i+1)+'</span><span>'+g+'</span></div>');});
  if(row.diary)p.push('<div class="dr"><span class="dl">일기</span><span>'+row.diary+'</span></div>');
  if(!p.length){det.classList.remove('vis');return;}
  var arr=ds.split('-');
  det.innerHTML='<div class="ddt">'+arr[0]+'년 '+parseInt(arr[1])+'월 '+parseInt(arr[2])+'일</div>'+p.join('');
  det.classList.add('vis');
}

document.getElementById('calPrev').addEventListener('click',function(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}document.getElementById('dayDetail').classList.remove('vis');loadCalData(calYear,calMonth);});
document.getElementById('calNext').addEventListener('click',function(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}document.getElementById('dayDetail').classList.remove('vis');loadCalData(calYear,calMonth);});

function renderChart(){
  var w=document.getElementById('moodChart');
  var days=new Date(calYear,calMonth+1,0).getDate();
  var h='';
  for(var d=1;d<=days;d++){
    var ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var row=calData[ds];var val=row?row.mood||0:0;var emoji=row?row.mood_emoji:null;
    var ht=val?Math.round((val/5)*100):4;var sl=(d===1||d%5===0);
    h+='<div class="cbw">'+(emoji?'<span class="ce">'+emoji+'</span>':'<span class="ce" style="opacity:0">.</span>')+'<div class="cb'+(val?' fi':'')+'" style="height:'+ht+'%"></div><span class="cbl">'+(sl?d:'')+'</span></div>';
  }
  w.innerHTML=h;
}

function loadSaved(){
  fetch(SB_URL+'/rest/v1/haru_saved?user_id=eq.'+userId+'&select=*&order=created_at.desc&limit=50',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+userToken}
  }).then(function(r){return r.json();})
  .then(function(rows){
    var list=document.getElementById('savedList');
    if(!rows||!rows.length){list.innerHTML='<div class="es"><div class="ei">🌸</div>아직 저장한 명언이 없어.<br>마음에 드는 명언을 저장해봐!</div>';return;}
    list.innerHTML=rows.map(function(s){return '<div class="si"><div class="sit">\u201C'+s.quote+'\u201D</div><div class="sim">'+(s.author?'— '+s.author+' · ':'')+s.date+'</div></div>';}).join('');
    renderStreak();
  }).catch(function(){});
}

document.querySelectorAll('.tb').forEach(function(btn){
  btn.addEventListener('click',function(){
    var tab=btn.dataset.tab;
    ['home','record','saved'].forEach(function(t){
      document.getElementById('pg'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active',t===tab);
      document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('on',t===tab);
    });
    if(tab==='record'){calYear=new Date().getFullYear();calMonth=new Date().getMonth();loadCalData(calYear,calMonth);}
    if(tab==='saved')loadSaved();
  });
});

function toast(msg){var t=document.getElementById('toastEl');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});

// ── 앱 시작 ──
(function init(){
  // 항상 로그인 화면 먼저
  document.getElementById('authScreen').style.display='block';
  document.getElementById('mainApp').style.display='none';

  if(!loadSession()){ return; }

  // 세션 있으면 토큰 유효한지 확인
  fetch(SB_URL+'/auth/v1/user',{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+userToken}
  }).then(function(r){
    if(r.ok){
      return r.json().then(function(u){
        userId=u.id;
        showApp();
      });
    } else {
      // 토큰 만료 - refresh 시도
      return refreshSession().then(function(ok){
        if(ok){ showApp(); }
        else {
          localStorage.removeItem('haru_session');
          // 로그인 화면 이미 보이고 있음
        }
      });
    }
  }).catch(function(){
    // 네트워크 오류면 로그인 화면 유지
    localStorage.removeItem('haru_session');
  });
})();
</script>
