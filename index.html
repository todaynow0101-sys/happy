<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9aa2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한마디">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<title>오늘의 한 마디</title>
<style>
  :root {
    --pink: #ff9aa2;
    --pink-light: #fff0f1;
    --pink-mid: #ffd6d9;
    --pink-dark: #d96b75;
    --text: #2d2326;
    --text-muted: #9e7e83;
    --text-hint: #c4a9ae;
    --bg: #fffcfc;
    --card: #ffffff;
    --border: rgba(255,154,162,0.18);
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    min-height: -webkit-fill-available;
    overscroll-behavior: none;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    padding: 0 20px;
    padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 20px) 0 16px;
  }
  .header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header-left .date { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .streak-pill {
    display: flex; align-items: center; gap: 5px;
    background: var(--pink-light); border: 1px solid var(--pink-mid);
    border-radius: 20px; padding: 6px 12px;
    font-size: 13px; font-weight: 600; color: var(--pink-dark);
  }
  .streak-pill .flame { font-size: 15px; }

  /* Theme chips */
  .themes {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 4px 0 12px;
  }
  .chip {
    padding: 6px 4px; border-radius: 16px;
    font-size: 11px; font-weight: 500;
    border: 1.5px solid var(--pink-mid);
    background: white; color: var(--text-muted);
    cursor: pointer; transition: all 0.18s;
    text-align: center; white-space: nowrap;
  }
  .chip.active {
    background: var(--pink); border-color: var(--pink);
    color: white; font-weight: 600;
  }

  /* Quote card */
  .quote-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px 22px;
    margin-bottom: 14px;
    box-shadow: 0 4px 24px rgba(255,154,162,0.10);
    min-height: 200px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .quote-card::before {
    content: '\201C';
    position: absolute; top: 12px; left: 18px;
    font-size: 72px; line-height: 1;
    color: var(--pink-mid); font-family: Georgia, serif;
    pointer-events: none;
  }
  .quote-body { padding-top: 28px; flex: 1; }
  .quote-text {
    font-size: 18px; line-height: 1.7; font-weight: 400;
    color: var(--text); word-break: keep-all;
    font-family: 'Apple SD Gothic Neo', 'Noto Serif KR', serif;
  }
  .quote-text.placeholder { color: var(--text-hint); font-size: 15px; font-style: normal; }
  .quote-author {
    font-size: 13px; color: var(--text-muted);
    margin-top: 16px; font-weight: 500;
  }
  .quote-context {
    font-size: 13px; color: var(--text-muted);
    margin-top: 10px; line-height: 1.6;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .dots { display: flex; gap: 6px; align-items: center; padding: 24px 0; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pink-mid);
    animation: blink 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

  /* Card actions */
  .card-actions {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .card-actions button {
    flex: 1; padding: 11px 8px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--pink-mid);
    background: white; color: var(--text-muted);
    font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s;
  }
  .card-actions button:active { transform: scale(0.97); }
  .card-actions button.saved-btn {
    color: var(--pink-dark); border-color: var(--pink);
    background: var(--pink-light);
  }
  .icon { font-size: 16px; }

  /* Generate button */
  .gen-btn {
    width: 100%; padding: 15px;
    background: var(--pink); color: white;
    border: none; border-radius: var(--radius-sm);
    font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: -0.3px;
    transition: all 0.15s; margin-bottom: 20px;
  }
  .gen-btn:active { transform: scale(0.98); opacity: 0.9; }
  .gen-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Reflection */
  .reflection-box {
    background: var(--pink-light);
    border: 1px solid var(--pink-mid);
    border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px;
  }
  .reflection-box label {
    font-size: 13px; font-weight: 600; color: var(--pink-dark);
    display: block; margin-bottom: 10px;
  }
  .reflection-box textarea {
    width: 100%; border: 1px solid var(--pink-mid);
    border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 15px; font-family: inherit;
    background: white; color: var(--text);
    resize: none; outline: none;
    line-height: 1.6;
  }
  .reflection-box textarea:focus { border-color: var(--pink); }
  .reflection-box textarea::placeholder { color: var(--text-hint); }
  .reflection-save {
    margin-top: 10px; float: right;
    padding: 8px 18px; border-radius: 20px;
    border: 1.5px solid var(--pink); background: white;
    color: var(--pink-dark); font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .reflection-save:active { background: var(--pink-light); }
  .clear { clear: both; }

  /* Saved section */
  .saved-section { margin-bottom: 20px; }
  .section-title {
    font-size: 14px; font-weight: 600; color: var(--text-muted);
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }
  .saved-item {
    background: white; border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 16px;
    margin-bottom: 8px;
  }
  .saved-item .si-text { font-size: 14px; line-height: 1.6; color: var(--text); }
  .saved-item .si-meta { font-size: 11px; color: var(--text-hint); margin-top: 6px; }

  /* Bottom tab nav */
  .tab-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; border-top: 1px solid var(--pink-mid);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10px 0 8px; gap: 3px;
    font-size: 11px; font-weight: 500; color: var(--text-hint);
    cursor: pointer; border: none; background: none;
  }
  .tab-btn .tab-icon { font-size: 22px; line-height: 1; }
  .tab-btn.active { color: var(--pink); }

  .page { display: none; }
  .page.active { display: block; }
  .app { padding-bottom: calc(env(safe-area-inset-bottom) + 72px); }

  /* Saved page empty state */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-hint); font-size: 14px; }
  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }

  /* Toast */
  .toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 70px);
    left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--text); color: white;
    padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 500;
    opacity: 0; transition: all 0.25s; pointer-events: none;
    white-space: nowrap; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
<div class="page active" id="pageHome">
  <div class="header">
    <div class="header-left">
      <h1>오늘의 한 마디 🌱</h1>
      <div class="date" id="dateLabel"></div>
    </div>
    <div class="streak-pill">
      <span class="flame">🔥</span>
      <span id="streakNum">0</span>일
    </div>
  </div>

  <div class="themes" id="themeRow">
    <div class="chip active" data-theme="도전·동기부여">🔥 도전</div>
    <div class="chip" data-theme="평온·마음챙김">🌿 평온</div>
    <div class="chip" data-theme="성장·배움">📚 성장</div>
    <div class="chip" data-theme="감사·관계">🤝 감사</div>
    <div class="chip" data-theme="용기·결단">⚡ 용기</div>
  </div>

  <div class="quote-card" id="quoteCard">
    <div class="quote-body">
      <div class="quote-text placeholder" id="quoteText">테마를 고르고<br>명언 받기를 눌러봐 ✨</div>
      <div class="quote-author" id="quoteAuthor" style="display:none"></div>
      <div class="quote-context" id="quoteContext" style="display:none"></div>
    </div>
  </div>

  <div class="card-actions" id="cardActions" style="display:none">
    <button id="saveBtn">
      <span class="icon">🔖</span> 저장
    </button>
    <button id="regenBtn">
      <span class="icon">🔄</span> 다시 받기
    </button>
  </div>

  <button class="gen-btn" id="genBtn">오늘의 명언 받기</button>

  <div class="reflection-box" id="reflectionBox" style="display:none">
    <label>🌅 오늘 기대되는 것, 딱 하나는?</label>
    <textarea id="reflectionInput" rows="2" placeholder="짧게라도 써봐. 하루가 달라져."></textarea>
    <button class="reflection-save" id="reflSaveBtn">저장</button>
    <div class="clear"></div>
  </div>

</div><!-- /pageHome -->

<div class="page" id="pageSaved">
  <div class="header" style="margin-bottom:4px">
    <div class="header-left"><h1>저장한 명언 🔖</h1></div>
    <div class="streak-pill"><span class="flame">🔥</span><span id="streakNum2">0</span>일</div>
  </div>
  <div id="savedList"></div>
</div>

</div><!-- /app -->

<nav class="tab-nav">
  <button class="tab-btn active" id="tabHome" onclick="switchTab('home')">
    <span class="tab-icon">🌱</span>오늘
  </button>
  <button class="tab-btn" id="tabSaved" onclick="switchTab('saved')">
    <span class="tab-icon">🔖</span>저장
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const QUOTES = {"도전·동기부여": [{"quote": "시작이 반이다.", "author": "아리스토텔레스"}, {"quote": "불가능이란 노력하지 않는 자의 변명이다.", "author": "나폴레옹"}, {"quote": "넘어지는 것이 실패가 아니라, 넘어진 채로 있는 것이 실패다.", "author": "메리 픽포드"}, {"quote": "당신이 할 수 있다고 생각하든, 할 수 없다고 생각하든, 당신의 생각이 맞다.", "author": "헨리 포드"}, {"quote": "천 리 길도 한 걸음부터.", "author": "노자"}, {"quote": "꿈을 꾸는 것만으로는 충분하지 않다. 꿈을 향해 걸어야 한다.", "author": "빅토르 위고"}, {"quote": "지금 이 순간, 당신은 충분히 용감하다.", "author": "작자 미상"}, {"quote": "두려움은 꿈을 막는 가장 큰 적이다.", "author": "파울로 코엘료"}, {"quote": "포기하고 싶을 때가 바로 시작되는 순간이다.", "author": "작자 미상"}, {"quote": "실패는 성공의 어머니다.", "author": "토마스 에디슨"}, {"quote": "오늘 할 수 있는 일을 내일로 미루지 마라.", "author": "벤자민 프랭클린"}, {"quote": "열정이 있으면 불가능은 없다.", "author": "작자 미상"}, {"quote": "성공은 준비된 자에게 기회가 왔을 때 만들어진다.", "author": "세네카"}, {"quote": "작은 진전도 여전히 진전이다.", "author": "작자 미상"}, {"quote": "당신의 한계는 당신이 정하는 것이다.", "author": "작자 미상"}, {"quote": "고통 없이는 얻는 것도 없다.", "author": "벤자민 프랭클린"}, {"quote": "매일 조금씩 더 나아지는 것이 성공의 비결이다.", "author": "작자 미상"}, {"quote": "위대한 일은 충동으로 이루어지지 않는다. 작은 것들이 모여 이루어진다.", "author": "빈센트 반 고흐"}, {"quote": "어제보다 나은 오늘을 만들어라.", "author": "작자 미상"}, {"quote": "도전하지 않으면 아무것도 얻을 수 없다.", "author": "작자 미상"}, {"quote": "성공한 사람은 항상 다른 사람을 위해 좋은 기반을 닦으려 한다.", "author": "마리온 앤더슨"}, {"quote": "가장 어두운 밤도 결국 끝나고 해가 뜬다.", "author": "빅토르 위고"}, {"quote": "인생은 도전의 연속이다. 도전을 즐겨라.", "author": "작자 미상"}, {"quote": "행동이 항상 행복을 가져다주지는 않지만, 행동 없이는 행복도 없다.", "author": "벤자민 디즈레일리"}, {"quote": "당신이 원하는 것을 얻으려면 먼저 줘야 한다.", "author": "작자 미상"}, {"quote": "힘든 길이 종종 아름다운 목적지로 이어진다.", "author": "작자 미상"}, {"quote": "용기란 두려움이 없는 것이 아니라, 두려움보다 더 중요한 것이 있다고 판단하는 것이다.", "author": "암브로스 레드문"}, {"quote": "꿈을 이루는 유일한 방법은 깨어나서 일하는 것이다.", "author": "작자 미상"}, {"quote": "오늘의 고통은 내일의 힘이 된다.", "author": "작자 미상"}, {"quote": "멈추지 않는 한 얼마나 천천히 가든 상관없다.", "author": "공자"}, {"quote": "변화를 두려워하지 마라. 변화는 성장의 신호다.", "author": "작자 미상"}, {"quote": "가장 큰 위험은 아무런 위험도 감수하지 않는 것이다.", "author": "마크 저커버그"}, {"quote": "성공은 최종 목적지가 아니다. 실패도 치명적이지 않다. 중요한 것은 계속하는 용기다.", "autho ": "작자 미상"}, {"quote": "숨을 쉬어라. 지금 이 순간 당신은 안전하다.", "author": "작자 미상"}, {"quote": "고요함은 최고의 힘이다.", "author": "라오쯔"}, {"quote": "마음을 비우면 새로운 것이 채워진다.", "author": "작자 미상"}, {"quote": "바람이 불어도 산은 움직이지 않는다.", "author": "작자 미상"}, {"quote": "내가 통제할 수 없는 것을 내려놓을 때 자유로워진다.", "author": "작자 미상"}, {"quote": "지금 이 순간에 집중하라. 그것이 전부다.", "author": "작자 미상"}, {"quote": "서두르지 않아도 된다. 당신의 속도로 가면 된다.", "author": "작자 미상"}, {"quote": "자연은 서두르지 않는다. 그럼에도 모든 것이 이루어진다.", "author": "라오쯔"}, {"quote": "평온한 마음이 가장 큰 재산이다.", "author": "작자 미상"}, {"quote": "파도는 멈출 수 없지만, 파도를 타는 법은 배울 수 있다.", "author": "존 카밧진"}, {"quote": "지금 여기에 존재하는 것 자체가 충분하다.", "author": "작자 미상"}, {"quote": "나무는 폭풍에 흔들리지만 뿌리는 버틴다.", "author": "작자 미상"}, {"quote": "모든 것은 지나간다. 이것도 지나갈 것이다.", "author": "작자 미상"}, {"quote": "멈추고 숨을 쉬는 것도 용기다.", "author": "작자 미상"}, {"quote": "마음의 평화는 선택이다.", "author": "작자 미상"}, {"quote": "흐르는 물처럼 유연하게, 깊은 바다처럼 고요하게.", "author": "작자 미상"}, {"quote": "지금 이 순간을 느껴라. 이것이 삶이다.", "author": "작자 미상"}, {"quote": "걱정은 내일의 슬픔을 없애주지 못한다. 오늘의 기쁨만 빼앗아 갈 뿐이다.", "author": "코리 텐 붐"}, {"quote": "고요한 물이 더 깊이 흐른다.", "author": "작자 미상"}, {"quote": "억지로 하려 할수록 멀어진다. 내려놓을 때 찾아온다.", "author": "작자 미상"}, {"quote": "지금 이 순간 충분히 쉬어도 된다.", "author": "작자 미상"}, {"quote": "느리게 가도 괜찮다. 멈추지 않으면 된다.", "author": "작자 미상"}, {"quote": "내면의 고요함은 어떤 상황도 이겨낸다.", "author": "작자 미상"}, {"quote": "생각을 조용히 하면 답이 들린다.", "author": "작자 미상"}, {"quote": "지금 이 순간, 그것만으로도 충분하다.", "author": "틱낫한"}, {"quote": "바다가 파도를 이기려 하지 않듯, 때로는 그냥 흘러가게 두어라.", "author": "작자 미상"}, {"quote": "마음이 무거울 땐 잠시 내려놓아도 괜찮다.", "author": "작자 미상"}, {"quote": "고통을 받아들이면 더 이상 고통이 아니다.", "author": "작자 미상"}, {"quote": "오늘 하루, 그냥 있어도 된다.", "author": "작자 미상"}, {"quote": "숨을 들이마시고 내쉬는 것만으로도 충분히 잘하고 있다.", "author": "작자 미상"}, {"quote": "폭풍이 지나면 반드시 고요가 온다.", "author": "작자 미상"}, {"quote": "지금 이 순간 당신은 충분히 괜찮다.", "author": "작자 미상"}, {"quote": "분노는 뜨거운 석탄을 손에 쥐고 남에게 던지려는 것과 같다. 결국 자신이 다친다.", "author": "석가모니"}, {"quote": "마음이 평화롭다면 세상 어디서든 행복하다.", "author": "작자 미상"}, {"quote": "지금 이 순간을 살아가는 것이 가장 지혜로운 삶이다.", "author": "작자 미상"}, {"quote": "당신은 폭풍이 아니다. 폭풍을 지켜보는 하늘이다.", "author": "작자 미상"}, {"quote": "쉬는 것도 성장의 일부다.", "author": "작자 미상"}, {"quote": "마음의 소리에 귀를 기울여라.", "author": "작자 미상"}, {"quote": "서두르지 않는 것이 가장 빠른 길이다.", "author": "작자 미상"}, {"quote": "지금 여기, 이 순간이 가장 완전한 순간이다.", "author": "작자 미상"}, {"quote": "바람에 흔들리는 꽃도 뿌리는 단단하다.", "author": "작자 미상"}, {"quote": "고요함 속에서 진실이 보인다.", "author": "작자 미상"}, {"quote": "비가 내려야 무지개가 뜬다.", "author": "작자 미상"}, {"quote": "내가 통제할 수 없는 것에 에너지를 쏟지 마라.", "author": "에픽테토스"}, {"quote": "지금 이 순간만 살아라. 과거는 기억이고 미래는 상상이다.", "author": "작자 미상"}, {"quote": "마음을 고요히 하면 모든 것이 명확해진다.", "author": "작자 미상"}, {"quote": "당신은 생각이 아니라, 생각을 관찰하는 존재다.", "author": "작자 미상"}, {"quote": "지금 이 순간 충분히 숨쉬고, 충분히 살아있다.", "author": "작자 미상"}, {"quote": "모든 것은 변한다. 그것이 자연의 법칙이다.", "author": "석가모니"}, {"quote": "내 마음이 평화로우면 주변도 평화로워진다.", "author": "작자 미상"}, {"quote": "잠시 멈추고 하늘을 바라봐라. 세상은 여전히 아름답다.", "author": "작자 미상"}, {"quote": "오늘 하루는 다시 오지 않는다. 소중히 여겨라.", "author": "작자 미상"}, {"quote": "흐르는 강물처럼 자연스럽게 살아가라.", "author": "작자 미상"}, {"quote": "당신 안에 이미 평화가 있다. 찾기만 하면 된다.", "author": "작자 미상"}, {"quote": "복잡함 속에서 단순함을 찾아라.", "author": "레오나르도 다 빈치"}, {"quote": "마음이 조용하면 세상의 소음도 음악이 된다.", "author": "작자 미상"}, {"quote": "지금 이 순간을 충분히 느껴라. 그것이 명상이다.", "author": "작자 미상"}, {"quote": "자신에게 친절하라. 당신도 치유받을 자격이 있다.", "author": "작자 미상"}, {"quote": "숲 속의 나무처럼, 뿌리를 깊이 내리고 바람을 즐겨라.", "author": "작자 미상"}, {"quote": "고요함은 약함이 아니라, 내면의 강함이다.", "author": "작자 미상"}, {"quote": "당신의 감정은 당신이 아니다. 그것은 그냥 날씨다.", "author": "작자 미상"}, {"quote": "오늘 하루 한 가지 아름다운 것을 발견하라.", "author": "작자 미상"}, {"quote": "서두르지 마라. 좋은 것은 천천히 무르익는다.", "author": "작자 미상"}, {"quote": "지금 이 자리에 온전히 존재하는 것이 선물이다.", "author": "작자 미상"}, {"quote": "마음의 평화를 위해 오늘 한 가지를 내려놓아라.", "author": "작자 미상"}, {"quote": "당신은 폭풍을 지나쳐왔고, 앞으로도 지나칠 것이다.", "author": "작자 미상"}, {"quote": "쉬어가는 것도 나아가는 것이다.", "author": "작자 미상"}, {"quote": "지금 이 순간, 당신은 완전하다.", "author": "작자 미상"}, {"quote": "고요한 마음으로 바라보면 모든 것이 달리 보인다.", "author": "작자 미상"}, {"quote": "억지로 붙잡지 마라. 흘러가게 두어라.", "author": "작자 미상"}, {"quote": "오늘 하루도 충분히 잘하고 있다.", "author": "작자 미상"}, {"quote": "작은 것들에 감동받는 마음이 평화의 시작이다.", "author": "작자 미상"}, {"quote": "지금 여기, 이 순간이 전부다.", "author": "에크하르트 톨레"}, {"quote": "마음이 무거울 때일수록 천천히 숨을 쉬어라.", "author": "작자 미상"}, {"quote": "파도처럼 왔다가 가는 감정을 두려워하지 마라.", "author": "작자 미상"}, {"quote": "고요히 앉아 아무것도 하지 않아도 괜찮다.", "author": "작자 미상"}, {"quote": "지금 이 순간 살아있음에 감사하라.", "author": "작자 미상"}, {"quote": "내면의 평화가 외면의 아름다움을 만든다.", "author": "작자 미상"}, {"quote": "당신이 있는 곳이 당신이 있어야 할 곳이다.", "author": "작자 미상"}, {"quote": "오늘 하루, 온전히 나 자신이어도 된다.", "author": "작자 미상"}, {"quote": "평화는 문제가 없는 상태가 아니라, 문제를 다룰 수 있는 상태다.", "author": "작자 미상"}, {"quote": "지금 이 순간을 사랑하라. 다시는 오지 않는다.", "author": "작자 미상"}, {"quote": "조용히 앉아 차 한 잔을 마시는 것도 깨달음이다.", "author": "틱낫한"}, {"quote": "당신의 마음은 하늘과 같다. 구름이 지나가도 하늘은 늘 그 자리다.", "author": "작자 미상"}, {"quote": "지금 이 순간이 가장 완벽한 때다.", "author": "작자 미상"}, {"quote": "마음을 내려놓으면 모든 것이 가벼워진다.", "author": "작자 미상"}, {"quote": "자신에게 부드러워라. 당신은 여전히 배우는 중이다.", "author": "작자 미상"}, {"quote": "오늘 하루 한 번만 깊게 숨을 쉬어라. 모든 것이 조금 나아진다.", "author": "작자 미상"}, {"quote": "당신이 느끼는 감정은 모두 타당하다.", "author": "작자 미상"}, {"quote": "지금 이 순간 평화를 선택할 수 있다.", "author": "작자 미상"}, {"quote": "고요함 속에서 진짜 나를 만난다.", "author": "작자 미상"}, {"quote": "흘러가는 것들을 억지로 붙잡지 마라.", "author": "작자 미상"}, {"quote": "오늘 하루도 감사하며 시작하라.", "author": "작자 미상"}, {"quote": "마음이 평온하면 삶이 단순해진다.", "author": "작자 미상"}, {"quote": "지금 여기, 이 순간이 삶의 전부다.", "author": "작자 미상"}, {"quote": "당신은 지금 이 순간에도 충분히 빛나고 있다.", "author": "작자 미상"}], "성장·배움": [{"quote": "배움은 끝이 없다.", "author": "작자 미상"}, {"quote": "어제보다 1%만 나아져도 1년 후엔 37배 성장한다.", "author": "제임스 클리어"}, {"quote": "실수는 배움의 증거다.", "author": "작자 미상"}, {"quote": "책 한 권이 삶을 바꿀 수 있다.", "author": "작자 미상"}, {"quote": "모르는 것을 아는 것이 진정한 앎의 시작이다.", "author": "소크라테스"}, {"quote": "배우고 때로 익히면 또한 기쁘지 아니한가.", "author": "공자"}, {"quote": "성장은 편안함에서 나오지 않는다.", "author": "작자 미상"}, {"quote": "호기심은 지식의 어머니다.", "author": "작자 미상"}, {"quote": "새로운 것을 배우는 function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} }

function bumpStreak() {
  if (data.lastDate === today) return;
  const yd = new Date(now); yd.setDate(yd.getDate()-1);

  data.streak = data.lastDate === ys ? data.streak + 1 : 1;

}

  save(data);
  toast('다짐 저장 ✓');
});

function renderSaved() {
  const list = document.getElementById('savedList');
  document.getElementById('streakNum2').textContent = data.streak;
  if (!data.saved.length) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">🌸</div>아직 저장한 명언이 없어<br>마음에 드는 명언을 저장해봐!</div>';
    return;
  }
  list.innerHTML = data.saved.map(s =>
    `<div class="saved-item">
      <div class="si-text">\u201C${s.quote}\u201D</div>
      <div class="si-meta">${s.author ? '— ' + s.author + ' · ' : ''}${s.theme} · ${s.date}</div>
    </div>`
  ).join('');
}
renderSaved();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function switchTab(tab) {
  document.getElementById('pageHome').classList.toggle('active', tab === 'home');
  document.getElementById('pageSaved').classList.toggle('active', tab === 'saved');
  document.getElementById('tabHome').classList.toggle('active', tab === 'home');
  document.getElementById('tabSaved').classList.toggle('active', tab === 'saved');
  if (tab === 'saved') renderSaved();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
