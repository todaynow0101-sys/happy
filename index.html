<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9aa2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="예지">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<title>예지</title>
<style>
:root{--pink:#ff9aa2;--pink-light:#fff0f1;--pink-mid:#ffd6d9;--pink-dark:#d96b75;--text:#2d2326;--text-muted:#9e7e83;--text-hint:#c4a9ae;--bg:#fffcfc;--card:#ffffff;--border:rgba(255,154,162,0.18);--radius:20px;--radius-sm:12px;--nav-h:60px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none}
.app{max-width:430px;margin:0 auto;padding:0 20px calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
.page{display:none}.page.active{display:block}
.header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 0 14px}
.header h1{font-size:21px;font-weight:700;letter-spacing:-0.5px}
.header .date{font-size:12px;color:var(--text-muted);margin-top:2px}
.streak-pill{display:flex;align-items:center;gap:4px;background:var(--pink-light);border:1px solid var(--pink-mid);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--pink-dark);white-space:nowrap}



.quote-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px 20px;margin-bottom:12px;min-height:160px;position:relative;overflow:hidden}
.quote-card::before{content:open-quote;position:absolute;top:8px;left:14px;font-size:60px;line-height:1;color:var(--pink-mid);font-family:Georgia,serif;pointer-events:none}
.quote-body{padding-top:20px}
.quote-text{font-size:16px;line-height:1.7;color:var(--text);word-break:keep-all}
.quote-text.placeholder{color:var(--text-hint);font-size:14px}
.quote-author{font-size:13px;color:var(--text-muted);margin-top:12px;font-weight:500}
.dots{display:flex;gap:6px;align-items:center;padding:16px 0}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--pink-mid);animation:blink 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.card-actions{display:flex;gap:8px;margin-bottom:12px}
.card-actions button{flex:1;padding:10px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--pink-mid);background:white;color:var(--text-muted);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.card-actions button:active{transform:scale(0.97)}
.card-actions button.saved-btn{color:var(--pink-dark);border-color:var(--pink);background:var(--pink-light)}
.gen-btn{width:100%;padding:14px;background:var(--pink);color:white;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer;letter-spacing:-0.3px;margin-bottom:16px}
.gen-btn:active{opacity:.88;transform:scale(0.98)}.gen-btn:disabled{opacity:.45;cursor:not-allowed}
.section-card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.section-card .sc-title{font-size:13px;font-weight:600;color:var(--pink-dark);margin-bottom:12px}
.mood-row{display:flex;justify-content:space-between}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:2px solid transparent;border-radius:14px;padding:8px 10px;cursor:pointer;transition:all 0.15s;flex:1}
.mood-btn .mood-emoji{font-size:26px}.mood-btn .mood-label{font-size:10px;color:var(--text-hint);font-weight:500}
.mood-btn.selected{border-color:var(--pink);background:var(--pink-light)}
.mood-btn.selected .mood-label{color:var(--pink-dark)}
.gratitude-list{display:flex;flex-direction:column;gap:8px}
.gratitude-input{width:100%;border:1px solid var(--pink-mid);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;font-family:inherit;background:var(--pink-light);color:var(--text);outline:none}
.gratitude-input:focus{border-color:var(--pink);background:white}
.gratitude-input::placeholder{color:var(--text-hint)}
.save-row{display:flex;justify-content:flex-end;margin-top:10px}
.save-small-btn{padding:7px 18px;border-radius:20px;border:1.5px solid var(--pink);background:white;color:var(--pink-dark);font-size:13px;font-weight:600;cursor:pointer}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{font-size:15px;font-weight:700}
.cal-nav-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);padding:4px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:10px;color:var(--text-hint);font-weight:600;padding:4px 0}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--text-muted);position:relative;gap:1px}
.cal-cell.today{background:var(--pink-light);color:var(--pink-dark);font-weight:700}
.cal-dot{display:none;width:5px;height:5px;border-radius:50%;background:var(--pink)}
.cal-cell.has-data .cal-dot{display:block}
.cal-cell .cal-mood-icon{font-size:14px;line-height:1}
.cal-cell.other-month{opacity:.3;pointer-events:none}
.day-detail{background:var(--pink-light);border:1px solid var(--pink-mid);border-radius:var(--radius-sm);padding:14px 16px;margin-top:10px;font-size:13px;line-height:1.7;color:var(--text);display:none}
.day-detail.visible{display:block}
.day-detail .dd-date{font-size:12px;color:var(--pink-dark);font-weight:600;margin-bottom:8px}
.day-detail .dd-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:4px}
.day-detail .dd-label{color:var(--text-hint);min-width:40px}
.chart-wrap{margin-top:14px}
.chart-title{font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:10px}
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:80px}
.chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.chart-bar{width:100%;border-radius:6px 6px 0 0;background:var(--pink-mid);transition:height 0.3s;min-height:4px}
.chart-bar.filled{background:var(--pink)}
.chart-bar-label{font-size:9px;color:var(--text-hint)}
.chart-emoji{font-size:12px}
.saved-item{background:white;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px}
.saved-item .si-text{font-size:14px;line-height:1.6;color:var(--text)}
.saved-item .si-meta{font-size:11px;color:var(--text-hint);margin-top:6px}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-hint);font-size:14px;line-height:1.8}
.empty-state .e-icon{font-size:40px;margin-bottom:10px}
.tab-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:white;border-top:1px solid var(--pink-mid);display:flex;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;cursor:pointer;font-size:10px;font-weight:500;color:var(--text-hint)}
.tab-btn .ti{font-size:22px;line-height:1}
.tab-btn.active{color:var(--pink)}
.toast{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:9999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="page active" id="pageHome">
    <div class="header">
      <div><h1>오늘의 한 마디 🌱</h1><div class="date" id="dateLabel"></div></div>
      <div class="streak-pill">🔥 <span id="streakNum">0</span>일 연속</div>
    </div>
    <div class="quote-card">
      <div class="quote-body">
        <div class="quote-text placeholder" id="quoteText">명언 받기를 눌러봐 ✨</div>
        <div class="quote-author" id="quoteAuthor" style="display:none"></div>
      </div>
    </div>
    <div class="card-actions" id="cardActions" style="display:none">
      <button id="saveBtn">🔖 저장</button>
      <button id="regenBtn">🔄 다시 받기</button>
    </div>
    <button class="gen-btn" id="genBtn">오늘의 명언 받기</button>
    <div class="section-card" id="moodSection" style="display:none">
      <div class="sc-title">오늘 기분이 어때? 😊</div>
      <div class="mood-row">
        <button class="mood-btn" data-mood="5" data-emoji="😄"><span class="mood-emoji">😄</span><span class="mood-label">최고</span></button>
        <button class="mood-btn" data-mood="4" data-emoji="🙂"><span class="mood-emoji">🙂</span><span class="mood-label">좋아</span></button>
        <button class="mood-btn" data-mood="3" data-emoji="😐"><span class="mood-emoji">😐</span><span class="mood-label">보통</span></button>
        <button class="mood-btn" data-mood="2" data-emoji="😔"><span class="mood-emoji">😔</span><span class="mood-label">별로</span></button>
        <button class="mood-btn" data-mood="1" data-emoji="😢"><span class="mood-emoji">😢</span><span class="mood-label">힘들어</span></button>
      </div>
    </div>
    <div class="section-card" id="gratSection" style="display:none">
      <div class="sc-title">오늘 감사한 것 3가지 🙏</div>
      <div class="gratitude-list">
        <input class="gratitude-input" id="grat1" placeholder="감사한 것 1" maxlength="60">
        <input class="gratitude-input" id="grat2" placeholder="감사한 것 2" maxlength="60">
        <input class="gratitude-input" id="grat3" placeholder="감사한 것 3" maxlength="60">
      </div>
      <div class="save-row"><button class="save-small-btn" id="gratSaveBtn">저장</button></div>
    </div>
  </div>

  <div class="page" id="pageRecord">
    <div class="header">
      <h1>기록 📅</h1>
      <div class="streak-pill">🔥 <span id="streakNum2">0</span>일 연속</div>
    </div>
    <div class="section-card">
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrev">&#8249;</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-nav-btn" id="calNext">&#8250;</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-detail" id="dayDetail"></div>
    </div>
    <div class="section-card">
      <div class="chart-title">이번 달 기분 흐름 💭</div>
      <div class="chart-bars" id="moodChart"></div>
    </div>
  </div>

  <div class="page" id="pageSaved">
    <div class="header">
      <h1>저장한 명언 🔖</h1>
      <div class="streak-pill">🔥 <span id="streakNum3">0</span>일 연속</div>
    </div>
    <div id="savedList"></div>
  </div>
</div>

<nav class="tab-nav">
  <button class="tab-btn active" id="tabHome" data-tab="home"><span class="ti">🌱</span>오늘</button>
  <button class="tab-btn" id="tabRecord" data-tab="record"><span class="ti">📅</span>기록</button>
  <button class="tab-btn" id="tabSaved" data-tab="saved"><span class="ti">🔖</span>저장</button>
</nav>
<div class="toast" id="toast"></div>

<script>
var QUOTES = [{"quote": "당신이 통제할 수 없는 것에 에너지를 쏟지 마라. 당신이 통제할 수 있는 것에 집중하라.", "author": "에픽테토스"}, {"quote": "고통은 피할 수 없다. 하지만 괴로움은 선택이다.", "author": "마르쿠스 아우렐리우스"}, {"quote": "자기 자신이 되는 것, 그것이 가장 어렵고 가장 위대한 일이다.", "author": "니체"}, {"quote": "폭풍이 나무를 더 깊이 뿌리내리게 한다.", "author": "C.S. 루이스"}, {"quote": "당신의 상처가 있는 곳이 빛이 들어오는 곳이다.", "author": "루미"}, {"quote": "별을 보려면 어둠이 필요하다.", "author": "페르시아 속담"}, {"quote": "두 번 생각하고 한 번 말하라.", "author": "공자"}, {"quote": "지금 이 순간으로 돌아오라. 지금 이 순간이 전부다.", "author": "틱낫한"}, {"quote": "행복은 갖는 것이 아니라 되는 것이다.", "author": "마르쿠스 아우렐리우스"}, {"quote": "오늘 하루가 힘들었다면, 당신은 충분히 애썼다는 뜻이다."}, {"quote": "작은 것에 기뻐하는 사람이 가장 많이 행복하다.", "author": "괴테"}, {"quote": "살아있다는 것은 변한다는 것이고, 변한다는 것은 성숙해진다는 것이다.", "author": "앙리 베르그송"}, {"quote": "당신이 어떤 사람인지는 아무도 보지 않을 때 무엇을 하는지로 드러난다.", "author": "존 우든"}, {"quote": "나는 실패한 것이 아니라 잘 되지 않는 방법을 만 가지 발견한 것이다.", "author": "토마스 에디슨"}, {"quote": "지금 서 있는 곳이 마음에 들지 않는다면, 움직여라. 당신은 나무가 아니다.", "author": "짐 론"}, {"quote": "가장 어두운 밤도 끝나고 해는 뜬다.", "author": "빅토르 위고"}, {"quote": "당신이 사랑하는 것을 하라. 그것이 당신의 삶을 만든다.", "author": "스티브 잡스"}, {"quote": "완벽하지 않아도 괜찮다. 지금 이대로의 당신으로 충분하다."}, {"quote": "우리는 우리가 반복적으로 하는 것의 산물이다. 탁월함은 행동이 아니라 습관이다.", "author": "아리스토텔레스"}, {"quote": "당신의 삶은 당신의 생각이 만든다.", "author": "마르쿠스 아우렐리우스"}, {"quote": "자연은 서두르지 않는다. 그럼에도 모든 것이 이루어진다.", "author": "라오쯔"}, {"quote": "용기는 두려움이 없는 것이 아니라, 두려움보다 더 중요한 것이 있다고 판단하는 것이다.", "author": "넬슨 만델라"}, {"quote": "인생은 자전거 타기와 같다. 균형을 유지하려면 계속 움직여야 한다.", "author": "알베르트 아인슈타인"}, {"quote": "당신이 할 수 있다고 믿든 없다고 믿든, 당신의 믿음이 맞다.", "author": "헨리 포드"}, {"quote": "고요함은 약함이 아니라 내면의 강함이다."}, {"quote": "실패는 선택지가 아닌 기회다.", "author": "토마스 에디슨"}, {"quote": "당신이 세상을 바꾸고 싶다면, 먼저 침대를 정리하라.", "author": "윌리엄 맥레이븐"}, {"quote": "파도를 멈출 수는 없지만, 파도를 타는 법은 배울 수 있다.", "author": "존 카밧진"}, {"quote": "모든 전문가는 한때 초보자였다.", "author": "헬렌 헤이스"}, {"quote": "행복은 목적지가 아니라 여행 방식이다.", "author": "마거릿 리"}, {"quote": "당신의 가장 큰 두려움이 당신의 가장 큰 기회다."}, {"quote": "삶이 당신에게 레몬을 준다면, 레모네이드를 만들어라.", "author": "데일 카네기"}, {"quote": "지금 이 순간이 가장 중요하다. 이 순간은 다시 오지 않는다.", "author": "틱낫한"}, {"quote": "사람은 자기가 생각하는 대로 된다.", "author": "마르쿠스 아우렐리우스"}, {"quote": "배움은 끝이 없다. 그래서 삶은 흥미롭다."}, {"quote": "당신의 현재 상황이 당신의 최종 목적지를 결정하지 않는다."}, {"quote": "진정한 발견의 여정은 새로운 땅을 찾는 것이 아니라, 새로운 눈을 갖는 것이다.", "author": "마르셀 프루스트"}, {"quote": "당신은 당신이 생각하는 것보다 훨씬 강하다."}, {"quote": "가장 중요한 것은 살아가는 것이 아니라 잘 살아가는 것이다.", "author": "소크라테스"}, {"quote": "꽃이 피는 것을 서두르지 않듯, 당신도 서두를 필요 없다."}, {"quote": "어두운 터널의 끝에는 반드시 빛이 있다."}, {"quote": "당신이 내쉬는 숨 하나하나가 새로운 시작이다.", "author": "틱낫한"}, {"quote": "비교는 기쁨의 도둑이다.", "author": "시어도어 루스벨트"}, {"quote": "당신의 이야기는 아직 끝나지 않았다."}, {"quote": "오늘 심은 씨앗이 언젠가 그늘이 되어줄 나무가 된다.", "author": "워렌 버핏"}, {"quote": "남과 비교하지 마라. 그것은 자신을 모욕하는 행위다.", "author": "빌 게이츠"}, {"quote": "자신을 사랑하는 것이 모든 사랑의 시작이다.", "author": "오스카 와일드"}, {"quote": "당신이 무엇에 집중하느냐가 당신의 현실이 된다.", "author": "오프라 윈프리"}, {"quote": "고난은 사람을 더 강하게 만들거나, 더 깊게 만든다. 둘 다이면 더욱 좋다."}, {"quote": "인생의 의미는 자신의 재능을 찾는 것이고, 삶의 목적은 그것을 나누는 것이다.", "author": "파블로 피카소"}, {"quote": "매일 아침 당신에게는 두 가지 선택지가 있다. 계속 자거나, 꿈을 이루기 위해 일어나거나."}, {"quote": "깊은 강은 조용히 흐른다.", "author": "셰익스피어"}, {"quote": "당신이 사랑받을 자격이 있다는 것을 잊지 마라."}, {"quote": "지혜는 경험에서 오고, 경험은 어리석음에서 온다.", "author": "오스카 와일드"}, {"quote": "오늘 할 수 있는 일을 내일로 미루지 마라.", "author": "벤자민 프랭클린"}, {"quote": "당신의 마음은 정원과 같다. 가꾸지 않으면 잡초가 자란다."}, {"quote": "좋은 판단은 경험에서 오고, 경험은 나쁜 판단에서 온다.", "author": "마크 트웨인"}, {"quote": "어제는 역사고, 내일은 미스터리다. 오늘은 선물이다. 그래서 현재를 present라고 한다.", "author": "빌 킨"}, {"quote": "당신이 가진 것에 감사하라. 감사는 더 많은 것을 불러온다.", "author": "오프라 윈프리"}, {"quote": "삶은 가까이서 보면 비극이지만, 멀리서 보면 희극이다.", "author": "찰리 채플린"}, {"quote": "당신이 시작하는 것이 아니라 끝내는 것이 중요하다."}, {"quote": "모든 것은 지나간다. 이것도 지나갈 것이다.", "author": "에이브러햄 링컨"}, {"quote": "당신은 실수를 저지른 것이 아니라 배움을 얻은 것이다."}, {"quote": "마음이 가는 곳에 에너지가 흐른다."}, {"quote": "한 번에 한 걸음씩. 그것만으로 산을 오를 수 있다."}, {"quote": "당신이 오늘 포기하면 어제의 노력이 사라진다."}, {"quote": "진짜 용기는 두렵더라도 옳은 일을 하는 것이다.", "author": "J.K. 롤링"}, {"quote": "우리가 두려워하는 것은 대부분 일어나지 않는다.", "author": "미셸 드 몽테뉴"}, {"quote": "당신의 에너지는 당신이 집중하는 것을 향해 흐른다. 현명하게 선택하라."}, {"quote": "삶에서 가장 아름다운 것들은 계획되지 않은 것들이다."}, {"quote": "오늘 하루가 당신의 걸작이 될 수 있다.", "author": "존 우든"}, {"quote": "당신이 어떤 상황에 있든, 그것은 영원하지 않다."}, {"quote": "진정한 행복은 원하는 것을 얻는 것이 아니라, 가진 것을 원하는 것이다."}, {"quote": "멈추지 않는 한 얼마나 천천히 가든 상관없다.", "author": "공자"}, {"quote": "당신이 남기는 흔적이 당신의 삶이다."}, {"quote": "우리는 보는 것을 믿는 것이 아니라, 믿는 것을 본다."}, {"quote": "당신이 선택한 생각이 당신의 감정을 만들고, 당신의 감정이 당신의 행동을 만든다."}, {"quote": "세상에서 가장 어려운 일은 자기 자신을 아는 것이다.", "author": "탈레스"}, {"quote": "지금 이 고통도 언젠가는 힘이 된다."}, {"quote": "당신이 도달하고자 하는 곳보다 어떻게 살아가느냐가 더 중요하다."}, {"quote": "아름다움은 눈에 있지 않고 마음에 있다.", "author": "칼릴 지브란"}, {"quote": "인생은 우리에게 일어나는 것이 아니라, 우리가 반응하는 방식이다.", "author": "에픽테토스"}, {"quote": "성공은 최종 목적지가 아니다. 실패도 치명적이지 않다. 중요한 것은 계속하는 용기다.", "author": "윈스턴 처칠"}, {"quote": "당신의 현재 상황이 영원하지 않다는 것을 기억하라."}, {"quote": "감사하는 마음은 삶을 풍요롭게 만드는 가장 빠른 방법이다."}, {"quote": "혼자 가면 빠르고, 함께 가면 멀리 간다.", "author": "아프리카 속담"}, {"quote": "당신이 오늘 보내는 시간이 내일의 당신을 만든다."}, {"quote": "사랑은 동사다.", "author": "스티븐 코비"}, {"quote": "작은 친절이 세상을 더 따뜻하게 만든다."}, {"quote": "당신이 웃으면 세상도 함께 웃는다.", "author": "엘라 윌콕스"}, {"quote": "기적은 기도하는 자에게 오는 것이 아니라 행동하는 자에게 온다."}, {"quote": "가장 소중한 것은 눈에 보이지 않는다.", "author": "생텍쥐페리"}, {"quote": "당신이 어떤 씨앗을 심느냐가 당신이 어떤 열매를 맺느냐를 결정한다."}, {"quote": "오늘의 나는 어제의 선택이 만들었고, 내일의 나는 오늘의 선택이 만든다."}, {"quote": "당신은 당신의 생각이 아니다. 당신은 생각을 관찰하는 존재다.", "author": "에크하르트 톨레"}, {"quote": "내가 통제할 수 없는 것을 내려놓을 때 진짜 자유가 시작된다.", "author": "에픽테토스"}, {"quote": "모든 아침은 새로운 기회다. 그것을 낭비하지 마라."}, {"quote": "당신이 살아있다는 것 자체가 이미 기적이다."}, {"quote": "삶은 당신이 만들어가는 것이다. 기다리는 것이 아니다."}, {"quote": "당신이 반응하는 방식을 선택할 수 있다는 것, 그것이 진정한 자유다.", "author": "빅터 프랭클"}, {"quote": "삶의 의미는 찾는 것이 아니라 만들어가는 것이다.", "author": "빅터 프랭클"}, {"quote": "당신이 겪는 모든 것은 당신을 위해 설계된 것이다.", "author": "마르쿠스 아우렐리우스"}, {"quote": "현재에 집중하라. 과거를 후회하거나 미래를 걱정하는 것은 현재를 낭비하는 것이다.", "author": "마르쿠스 아우렐리우스"}, {"quote": "당신이 잃어버린 것을 슬퍼하지 말고, 당신이 가진 것을 기뻐하라.", "author": "에픽테토스"}, {"quote": "사람들이 당신을 괴롭히는 것이 아니라, 당신이 그것을 어떻게 받아들이느냐가 당신을 괴롭힌다.", "author": "에픽테토스"}, {"quote": "부유한 것은 원하는 것을 많이 갖는 게 아니라, 적게 원하는 것이다.", "author": "에픽테토스"}, {"quote": "지금 이 순간 당신에게 닥친 모든 것은 반드시 이유가 있다.", "author": "마르쿠스 아우렐리우스"}, {"quote": "운명을 사랑하라. 당신에게 일어나는 모든 것을 원하라.", "author": "니체"}, {"quote": "자신을 극복하는 자가 가장 강한 자다.", "author": "니체"}, {"quote": "당신 안에 있는 혼돈에서 춤추는 별이 태어난다.", "author": "니체"}, {"quote": "우리는 고통을 통해서만 성장한다.", "author": "칼 융"}, {"quote": "그림자를 받아들이지 않으면 빛도 없다.", "author": "칼 융"}, {"quote": "당신이 무의식을 의식화하지 않으면, 무의식이 당신의 삶을 지배한다.", "author": "칼 융"}, {"quote": "존재한다는 것은 변화하는 것이고, 변화한다는 것은 성숙하는 것이다.", "author": "앙리 베르그송"}, {"quote": "철학의 시작은 놀라움이다.", "author": "아리스토텔레스"}, {"quote": "덕은 행동 속에 있다.", "author": "아리스토텔레스"}, {"quote": "교육의 목적은 즐거움을 올바른 것에서 찾는 법을 가르치는 것이다.", "author": "아리스토텔레스"}, {"quote": "나는 아무것도 모른다는 것을 안다.", "author": "소크라테스"}, {"quote": "검토되지 않은 삶은 살 가치가 없다.", "author": "소크라테스"}, {"quote": "강한 마음은 생각을 논하고, 평범한 마음은 사건을 논하고, 작은 마음은 사람을 논한다.", "author": "엘리너 루스벨트"}, {"quote": "아무도 당신의 동의 없이 당신을 열등하게 만들 수 없다.", "author": "엘리너 루스벨트"}, {"quote": "미래는 자신의 꿈의 아름다움을 믿는 자의 것이다.", "author": "엘리너 루스벨트"}, {"quote": "당신이 두려워하는 것을 매일 하라.", "author": "엘리너 루스벨트"}, {"quote": "지식은 힘이지만, 지혜는 그 힘을 올바르게 쓰는 것이다.", "author": "프랜시스 베이컨"}, {"quote": "읽는 것은 완전한 사람을 만들고, 쓰는 것은 정확한 사람을 만든다.", "author": "프랜시스 베이컨"}, {"quote": "희망은 좋은 아침 식사이지만, 나쁜 저녁 식사다.", "author": "프랜시스 베이컨"}, {"quote": "제자가 준비되면 스승이 나타난다.", "author": "불교 격언"}, {"quote": "배우고 때로 익히면 또한 기쁘지 아니한가.", "author": "공자"}, {"quote": "세 사람이 함께 걸으면 그 중에 반드시 나의 스승이 있다.", "author": "공자"}, {"quote": "아는 것을 안다 하고, 모르는 것을 모른다 하는 것, 이것이 앎이다.", "author": "공자"}, {"quote": "인생의 목표는 길을 아는 것이 아니라 걷는 것이다.", "author": "선 격언"}, {"quote": "당신이 가진 모든 것이 사라진다 해도 당신의 내면은 사라지지 않는다.", "author": "선 격언"}, {"quote": "생각이 고요해지면 세상이 보인다.", "author": "노자"}, {"quote": "물은 다투지 않지만 모든 것을 이긴다.", "author": "노자"}, {"quote": "아는 자는 말하지 않고, 말하는 자는 알지 못한다.", "author": "노자"}, {"quote": "천 리 길도 한 걸음부터.", "author": "노자"}, {"quote": "이미 일어난 일에 집착하지 마라. 아직 오지 않은 것을 걱정하지 마라.", "author": "석가모니"}, {"quote": "당신의 마음이 당신의 세계를 만든다.", "author": "석가모니"}, {"quote": "고통의 뿌리는 집착이다.", "author": "석가모니"}, {"quote": "당신이 화를 낸다면 당신은 이미 진 것이다.", "author": "석가모니"}, {"quote": "걷는 것은 기적이다. 숨 쉬는 것은 기적이다. 존재하는 것은 기적이다.", "author": "틱낫한"}, {"quote": "미소는 가장 쉬운 명상이다.", "author": "틱낫한"}, {"quote": "평화는 걷는 길이다. 평화로 가는 길은 없다.", "author": "틱낫한"}, {"quote": "당신이 세상을 돌보려면 먼저 자신을 돌봐야 한다.", "author": "틱낫한"}, {"quote": "당신의 상처가 치유되면, 그 자리가 가장 강한 곳이 된다.", "author": "헤밍웨이"}, {"quote": "글을 쓰는 것은 쉽다. 빈 종이 앞에 앉아 이마에서 피가 날 때까지 기다리면 된다.", "author": "헤밍웨이"}, {"quote": "태양은 항상 뜬다.", "author": "헤밍웨이"}, {"quote": "세상은 아름답고 싸울 가치가 있다.", "author": "헤밍웨이"}, {"quote": "인간은 파괴될 수 있어도 패배할 수 없다.", "author": "헤밍웨이"}, {"quote": "가장 어두운 곳에서 별이 가장 밝게 빛난다.", "author": "찰스 디킨스"}, {"quote": "결코 늦지 않았다. 새로운 시작을 위해.", "author": "조지 엘리엇"}, {"quote": "당신의 과거가 당신의 미래를 결정하지 않는다.", "author": "루이자 메이 올콧"}, {"quote": "사랑은 상대방의 성장을 원하는 것이다.", "author": "에리히 프롬"}, {"quote": "사랑은 기술이다. 배워야 한다.", "author": "에리히 프롬"}, {"quote": "인간은 자유를 선고받았다.", "author": "장폴 사르트르"}, {"quote": "존재는 본질에 앞선다.", "author": "장폴 사르트르"}, {"quote": "타인은 지옥이다. 그러나 타인 없이는 살 수 없다.", "author": "장폴 사르트르"}, {"quote": "당신의 삶을 예술 작품으로 만들어라.", "author": "알베르 카뮈"}, {"quote": "반항하는 것은 살아있다는 증거다.", "author": "알베르 카뮈"}, {"quote": "행복하기 위해서는 너무 많이 생각하지 말아야 한다.", "author": "알베르 카뮈"}, {"quote": "부조리를 인정하는 것이 자유의 시작이다.", "author": "알베르 카뮈"}, {"quote": "당신은 이미 답을 알고 있다. 그것을 믿어라.", "author": "파울로 코엘료"}, {"quote": "무언가를 간절히 원할 때, 온 우주가 당신 편이 된다.", "author": "파울로 코엘료"}, {"quote": "당신의 심장이 있는 곳에 보물이 있다.", "author": "파울로 코엘료"}, {"quote": "두려움은 당신이 꿈을 포기할 때 사라지지 않는다. 당신이 꿈을 향해 나아갈 때 사라진다.", "author": "파울로 코엘료"}, {"quote": "모든 인간에게는 자신의 이야기가 있다. 그것이 삶이다.", "author": "가브리엘 가르시아 마르케스"}, {"quote": "사랑은 모든 답이 아니라, 더 나은 질문을 하게 만드는 것이다.", "author": "가브리엘 가르시아 마르케스"}, {"quote": "당신이 원하는 것을 상상할 수 있다면, 그것을 이룰 수 있다.", "author": "윌리엄 아서 워드"}, {"quote": "습관은 우리가 된 것이고, 목표는 우리가 될 것이다.", "author": "제임스 클리어"}, {"quote": "1% 나아지는 것은 눈에 띄지 않지만, 매일 1% 나아지면 1년 후 37배 나아진다.", "author": "제임스 클리어"}, {"quote": "당신의 정체성이 당신의 행동을 결정한다.", "author": "제임스 클리어"}, {"quote": "목표가 아니라 시스템에 집중하라.", "author": "제임스 클리어"}, {"quote": "자존감은 당신이 성취한 것에서 오지 않고, 당신이 누구인지에서 온다.", "author": "브레네 브라운"}, {"quote": "취약함은 약함이 아니라 용기다.", "author": "브레네 브라운"}, {"quote": "온전히 살기 위해서는 온전히 느껴야 한다.", "author": "브레네 브라운"}, {"quote": "당신이 다른 사람에게 어떻게 대하는지가 당신이 어떤 사람인지를 보여준다.", "author": "브레네 브라운"}, {"quote": "비교는 기쁨을 훔치는 도둑이다.", "author": "브레네 브라운"}, {"quote": "진정한 자아실현은 다른 사람을 돕는 것에서 온다.", "author": "에이브러햄 매슬로"}, {"quote": "당신이 될 수 있는 것이 되어야 한다, 그렇지 않으면 평화롭지 않다.", "author": "에이브러햄 매슬로"}, {"quote": "행복은 목표가 아니라 부산물이다.", "author": "엘리너 루스벨트"}, {"quote": "두뇌는 근육이다. 쓸수록 강해진다."}, {"quote": "당신의 뇌는 당신이 믿는 것을 현실로 만들려 한다. 올바른 것을 믿어라."}, {"quote": "감정은 정보다. 그것을 억압하지 말고 들어라."}, {"quote": "회복력은 쓰러지지 않는 것이 아니라, 쓰러졌을 때 일어나는 능력이다."}, {"quote": "당신의 생각을 관찰하라. 당신은 생각이 아니다.", "author": "에크하르트 톨레"}, {"quote": "지금 이 순간을 받아들이는 것이 깨달음의 시작이다.", "author": "에크하르트 톨레"}, {"quote": "고통은 저항에서 온다. 받아들임이 치유다.", "author": "에크하르트 톨레"}, {"quote": "창의성은 연결이다. 점들을 연결하는 것.", "author": "스티브 잡스"}, {"quote": "단순함은 복잡함의 최고봉이다.", "author": "레오나르도 다 빈치"}, {"quote": "예술은 자연이 아니라 자연에 대한 반응이다.", "author": "에밀 졸라"}, {"quote": "예술의 목적은 일상을 아름답게 보이게 하는 것이다.", "author": "앤디 워홀"}, {"quote": "모든 아이는 예술가다. 문제는 어른이 되어서도 예술가로 남는 것이다.", "author": "파블로 피카소"}, {"quote": "나는 6년이 걸린 그림에서도, 6분이 걸린 그림에서도 같은 가격을 받는다. 6분이 아니라 평생이 걸린 것이니.", "author": "제임스 맥닐 휘슬러"}, {"quote": "영감은 존재한다. 하지만 일하는 당신을 찾아와야 한다.", "author": "파블로 피카소"}, {"quote": "당신이 만들 수 있다고 생각하는 것보다 더 많은 것을 만들 수 있다."}, {"quote": "완벽한 작품은 없다. 완성된 작품만 있을 뿐이다.", "author": "레오나르도 다 빈치"}, {"quote": "실수를 두려워하지 마라. 실수는 창의성의 연료다."}, {"quote": "상상력은 지식보다 중요하다.", "author": "알베르트 아인슈타인"}, {"quote": "삶은 자전거를 타는 것과 같다. 균형을 유지하려면 계속 움직여야 한다.", "author": "알베르트 아인슈타인"}, {"quote": "두 가지 방법으로 살 수 있다. 아무것도 기적이 아닌 것처럼, 또는 모든 것이 기적인 것처럼.", "author": "알베르트 아인슈타인"}, {"quote": "같은 행동을 반복하면서 다른 결과를 기대하는 것은 미친 짓이다.", "author": "알베르트 아인슈타인"}, {"quote": "지식보다 중요한 것은 상상력이고, 사실보다 중요한 것은 이야기다.", "author": "알베르트 아인슈타인"}, {"quote": "당신이 모르는 것을 배우려는 의지가 성장의 시작이다."}, {"quote": "호기심은 학습의 엔진이다."}, {"quote": "과학은 의심하는 것에서 시작된다.", "author": "리처드 파인만"}, {"quote": "당신이 이해할 수 없다면, 아직 충분히 단순하게 설명하지 못한 것이다.", "author": "리처드 파인만"}, {"quote": "거인의 어깨 위에 서서 나는 더 멀리 볼 수 있었다.", "author": "아이작 뉴턴"}, {"quote": "리더는 사람들이 가고 싶지 않은 곳으로 데려가는 사람이다.", "author": "로잘린 카터"}, {"quote": "가장 어두울 때 빛이 필요하다.", "author": "마틴 루터 킹"}, {"quote": "정의를 위한 싸움이 길어질 때, 우리는 절망하지 않고 희망을 선택한다.", "author": "마틴 루터 킹"}, {"quote": "지금 시작하지 않으면 언제 시작할 것인가.", "author": "마틴 루터 킹"}, {"quote": "불가능해 보이는 것이 가능해지는 순간은 당신이 시도할 때다.", "author": "넬슨 만델라"}, {"quote": "항상 불가능해 보이기 전까지는.", "author": "넬슨 만델라"}, {"quote": "나는 실패한 것이 아니다. 다만 효과없는 방법을 배웠을 뿐이다.", "author": "토마스 에디슨"}, {"quote": "천재는 1퍼센트의 영감과 99퍼센트의 땀으로 이루어진다.", "author": "토마스 에디슨"}, {"quote": "기회는 노력하는 자에게 온다.", "author": "토마스 에디슨"}, {"quote": "당신의 시간은 한정되어 있다. 다른 사람의 삶을 사느라 낭비하지 마라.", "author": "스티브 잡스"}, {"quote": "배고픔을 유지하라. 어리석음을 유지하라.", "author": "스티브 잡스"}, {"quote": "좋은 예술가는 모방하고, 위대한 예술가는 훔친다.", "author": "스티브 잡스"}, {"quote": "실패는 선택이 아니다. 성장은 선택이다."}, {"quote": "당신이 무엇을 하든, 잘 하라.", "author": "에이브러햄 링컨"}, {"quote": "준비할 시간을 준다면 나무를 베는 데 8시간이 걸리지 않는다.", "author": "에이브러햄 링컨"}, {"quote": "40살이 넘으면 자신의 얼굴에 책임을 져야 한다.", "author": "에이브러햄 링컨"}, {"quote": "당신이 올바른 방향으로 걷고 있다면, 계속 걸어라."}, {"quote": "결과보다 과정을 즐기는 자가 끝까지 간다."}, {"quote": "성공한 사람과 실패한 사람의 차이는 포기하는 시점이다."}, {"quote": "당신이 지금 힘든 이유는 아직 성장하고 있기 때문이다."}, {"quote": "우리는 사랑받기 위해 태어났고, 사랑하기 위해 살아간다.", "author": "빅토르 위고"}, {"quote": "진정한 우정은 건강과 같다. 잃어버리기 전에는 그 가치를 모른다.", "author": "찰스 칼렙 콜턴"}, {"quote": "당신 곁에 있으면 자연스럽게 더 나은 사람이 되고 싶어지는 사람을 곁에 두어라."}, {"quote": "사람은 사랑하는 사람을 닮아간다."}, {"quote": "진정한 사랑은 상대방이 자신이 될 수 있도록 자유를 주는 것이다.", "author": "에리히 프롬"}, {"quote": "우리가 서로를 필요로 하는 것이 우리를 인간으로 만든다."}, {"quote": "혼자 있을 수 있어야 함께할 수 있다."}, {"quote": "가장 아름다운 것은 함께 웃는 것이다."}, {"quote": "당신이 사랑하는 사람에게 오늘 그 마음을 전하라. 내일은 없을 수도 있다."}, {"quote": "깊이 사랑받으면 강해지고, 깊이 사랑하면 용감해진다.", "author": "노자"}, {"quote": "사람들은 당신이 한 말은 잊어버리지만, 당신이 그들을 어떻게 느끼게 했는지는 절대 잊지 않는다.", "author": "마야 안젤루"}, {"quote": "당신이 넘어질 때 일으켜주는 사람이 진짜 친구다."}, {"quote": "가장 강한 사람은 혼자 서 있을 수 있는 사람이지만, 가장 행복한 사람은 함께할 수 있는 사람이다."}, {"quote": "당신의 존재 자체가 누군가에게 충분한 이유가 된다."}, {"quote": "당신이 사랑받을 자격이 있다는 것을 결코 의심하지 마라."}, {"quote": "당신이 가진 것에 집중하면 더 많아지고, 없는 것에 집중하면 더 부족해진다.", "author": "오프라 윈프리"}, {"quote": "행복은 준비된 마음을 가진 자에게 찾아온다.", "author": "루이 파스퇴르"}, {"quote": "당신이 깨어있는 모든 순간은 선물이다."}, {"quote": "감사는 과거를 아름답게 하고, 현재를 충만하게 하며, 미래를 밝게 한다.", "author": "멜로디 비티"}, {"quote": "행복은 더 많은 것을 갖는 것이 아니라, 가진 것을 더 깊이 즐기는 것이다."}, {"quote": "작은 것에서 기쁨을 찾는 사람이 가장 풍요롭다."}, {"quote": "오늘 아침 눈을 뜬 것 자체가 이미 충분한 이유다."}, {"quote": "당신의 인생에서 가장 좋은 것들은 공짜다. 그리고 두 번째로 좋은 것들도."}, {"quote": "행복은 물건이 아니라 사람에게서 온다."}, {"quote": "당신이 지금 서 있는 이 순간, 당신은 충분하다."}, {"quote": "인생에서 가장 아름다운 날들은 아직 살지 않은 날들이다.", "author": "니코스 카잔차키스"}, {"quote": "당신의 삶에서 가장 행복했던 순간들은 계획되지 않은 것들이었다."}, {"quote": "오늘 하루를 충분히 살면 그것으로 충분하다."}, {"quote": "기쁨은 나누면 두 배가 되고, 슬픔은 나누면 반이 된다.", "author": "스웨덴 속담"}, {"quote": "당신 주변의 평범한 것들이 사실은 기적이다."}, {"quote": "당신이 무너진 곳에서 당신만의 새로운 것이 피어난다.", "author": "루미"}, {"quote": "치유는 선형이 아니다. 뒤로 가는 것도 앞으로 가는 것이다."}, {"quote": "당신의 상처는 당신의 이야기의 일부지만 전부가 아니다."}, {"quote": "부러진 뼈가 붙은 자리가 가장 단단하다.", "author": "어니스트 헤밍웨이"}, {"quote": "폭풍 속에서도 닻을 내릴 수 있는 사람이 진정 강한 사람이다."}, {"quote": "당신이 지금 느끼는 것들은 모두 일시적이다. 하지만 당신은 영원하다."}, {"quote": "새벽 세 시는 영혼의 어두운 밤이다. 하지만 새벽은 온다.", "author": "F. 스콧 피츠제럴드"}, {"quote": "당신이 넘어진 횟수보다 일어선 횟수가 하나 더 많으면 된다."}, {"quote": "끝은 새로운 시작이다."}, {"quote": "당신이 겪은 것이 당신을 망가뜨린 것이 아니라 단련시킨 것이다."}, {"quote": "비가 내린 후에 꽃이 핀다."}, {"quote": "당신이 힘들다면, 그것은 당신이 여전히 싸우고 있다는 뜻이다."}, {"quote": "강한 사람은 아무것도 느끼지 않는 사람이 아니라, 다 느끼면서도 계속 나아가는 사람이다."}, {"quote": "지금 이 순간의 고통이 당신을 더 깊은 사람으로 만든다."}, {"quote": "당신은 당신이 겪은 것보다 강하다."}, {"quote": "과거는 기억이고, 미래는 상상이다. 지금 이 순간만이 현실이다."}, {"quote": "당신이 지금 하는 일이 10년 후를 만든다."}, {"quote": "시간은 되돌릴 수 없다. 그러므로 지금 이 순간을 잘 쓰라."}, {"quote": "오늘 하루가 당신의 남은 인생 중 가장 젊은 날이다."}, {"quote": "지금 이 순간에 완전히 존재하는 것, 그것이 var KEY = 'yj_v2';
var data = (function(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}})();
if(!data.saved) data.saved=[];
if(!data.streak) data.streak=0;
if(!data.lastDate) data.lastDate='';
if(!data.moods) data.moods={};
if(!data.moodEmojis) data.moodEmojis={};
if(!data.gratitude) data.gratitude={};
function saveD(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}

var todayDate = new Date();
var today = todayDate.toISOString().split('T')[0];
document.getElementById('dateLabel').textContent = todayDate.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});

function renderStreak(){
  var s = data.streak;
  ['streakNum','streakNum2','streakNum3'].forEach(function(id){var el=document.getElementById(id);if(el)el.textContent=s;});
}
renderStreak();

function bumpStreak(){
  if(data.lastDate===today) return;
  var yd=new Date(todayDate); yd.setDate(yd.getDate()-1);
  var ys=yd.toISOString().split('T')[0];
  data.streak = data.lastDate===ys ? data.streak+1 : 1;
  data.lastDate=today; saveD(); renderStreak();
}

var curQuote='', curAuthor='';
var loading=false;


  chip.classList.add('active');
  currentTheme = chip.dataset.theme;
});

function getRandomQuote(){
  return QUOTES[Math.floor(Math.random()*QUOTES.length)];
}

function generate(){
  if(loading) return;
  loading=true;
  var btn=document.getElementById('genBtn');
  btn.disabled=true; btn.textContent='고르는 중...';
  document.getElementById('cardActions').style.display='none';
  var sb=document.getElementById('saveBtn');
  sb.classList.remove('saved-btn'); sb.textContent='🔖 저장';
  var qt=document.getElementById('quoteText');
  var qa=document.getElementById('quoteAuthor');
  qt.className='quote-text';
  qt.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
  qa.style.display='none';
  setTimeout(function(){
    var p=getRandomQuote();
    if(!p){qt.textContent='다시 눌러봐.';qt.classList.add('placeholder');loading=false;btn.disabled=false;btn.textContent='다시 받기';return;}
    curQuote=p.quote||''; curAuthor=p.author||'';
    qt.textContent='“'+curQuote+'”';
    if(curAuthor){qa.textContent='— '+curAuthor;qa.style.display='block';}
    document.getElementById('cardActions').style.display='flex';
    document.getElementById('moodSection').style.display='block';
    document.getElementById('gratSection').style.display='block';
    loadGratitude(); loadMood(); bumpStreak();
    loading=false; btn.disabled=false; btn.textContent='다시 받기';
  },380);
}

document.getElementById('genBtn').addEventListener('click',generate);
document.getElementById('regenBtn').addEventListener('click',generate);
document.getElementById('saveBtn').addEventListener('click',function(){
  if(!curQuote) return;
  if(data.saved.find(function(s){return s.quote===curQuote;})){toast('이미 저장됨');return;}
  data.saved.unshift({quote:curQuote,author:curAuthor,date:today});
  if(data.saved.length>50) data.saved=data.saved.slice(0,50);
  saveD();
  var sb=document.getElementById('saveBtn');
  sb.classList.add('saved-btn'); sb.textContent='✅ 저장됨';
  toast('저장했어 ✓');
});

function loadMood(){
  var saved=data.moods[today];
  document.querySelectorAll('.mood-btn').forEach(function(b){b.classList.toggle('selected',b.dataset.mood==saved);});
}
document.getElementById('moodSection').addEventListener('click',function(e){
  var btn=e.target.closest('.mood-btn');
  if(!btn) return;
  document.querySelectorAll('.mood-btn').forEach(function(b){b.classList.remove('selected');});
  btn.classList.add('selected');
  data.moods[today]=parseInt(btn.dataset.mood);
  data.moodEmojis[today]=btn.dataset.emoji;
  saveD(); toast('기분 저장 ✓');
});

function loadGratitude(){
  var g=data.gratitude[today]||['','',''];
  document.getElementById('grat1').value=g[0]||'';
  document.getElementById('grat2').value=g[1]||'';
  document.getElementById('grat3').value=g[2]||'';

  var html=dows.map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join('');
  var first=new Date(calYear,calMonth,1).getDay();
  var last=new Date(calYear,calMonth+1,0).getDate();
  var prevLast=new Date(calYear,calMonth,0).getDate();
  for(var i=0;i<first;i++) html+='<div class="cal-cell other-month">'+(prevLast-first+i+1)+'</div>';
  for(var d=1;d<=last;d++){
    var ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isToday=ds===today;
    var mood=data.moods[ds];
    var emoji=data.moodEmojis[ds];
    var hasData=mood||(data.gratitude[ds]&&data.gratitude[ds].some(Boolean));
    var cls='cal-cell'+(isToday?' today':'')+(hasData?' has-data':'');
    var inner=emoji?'<span class="cal-mood-icon">'+emoji+'</span><span style="font-size:10px">'+d+'</span>':d;
    html+='<div class="'+cls+'" data-date="'+ds+'">'+inner+(hasData&&!emoji?'<span class="cal-dot"></span>':'')+'</div>';
  }
  var rem=7-((first+last)%7);
  if(rem<7) for(var j=1;j<=rem;j++) html+='<div class="cal-cell other-month">'+j+'</div>';
  grid.innerHTML=html;
  grid.querySelectorAll('.cal-cell:not(.other-month)').forEach(function(cell){
    cell.addEventListener('click',function(){showDayDetail(cell.dataset.date);});
  });
  renderMoodChart();
}
function showDayDetail(ds){
  var detail=document.getElementById('dayDetail');
  var mood=data.moods[ds], emoji=data.moodEmojis[ds], grat=data.gratitude[ds];
  var parts=[];
  if(emoji) parts.push('<div class="dd-row"><span class="dd-label">기분</span><span>'+emoji+' '+['','힘들어','별로','보통','좋아','최고'][mood||0]+'</span></div>');
  if(grat&&grat.some(Boolean)) grat.filter(Boolean).forEach(function(g,i){parts.push('<div class="dd-row"><span class="dd-label">감사'+(i+1)+'</span><span>'+g+'</span></div>');});
  if(!parts.length){detail.classList.remove('visible');return;}
  var arr=ds.split('-');
  detail.innerHTML='<div class="dd-date">'+arr[0]+'년 '+parseInt(arr[1])+'월 '+parseInt(arr[2])+'일</div>'+parts.join('');
  detail.classList.add('visible');
}
document.getElementById('calPrev').addEventListener('click',function(){
  calMonth--; if(calMonth<0){calMonth=11;calYear--;} document.getElementById('dayDetail').classList.remove('visible'); renderCalendar();
});
document.getElementById('calNext').addEventListener('click',function(){
  calMonth++; if(calMonth>11){calMonth=0;calYear++;} document.getElementById('dayDetail').classList.remove('visible'); renderCalendar();
});
function renderMoodChart(){
  var wrap=document.getElementById('moodChart');
  var days=new Date(calYear,calMonth+1,0).getDate();
  var html='';
  for(var d=1;d<=days;d++){
    var ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var val=data.moods[ds]||0, emoji=data.moodEmojis[ds];
    var h=val?Math.round((val/5)*100):4;
    var showLabel=(d===1||d%5===0);
    html+='<div class="chart-bar-wrap">'+(emoji?'<span class="chart-emoji">'+emoji+'</span>':'<span class="chart-emoji" style="opacity:0">.</span>')+'<div class="chart-bar'+(val?' filled':'')+'" style="height:'+h+'%"></div><span class="chart-bar-label">'+(showLabel?d:'')+'</span></div>';
  }
  wrap.innerHTML=html;
}
function renderSaved(){
  renderStreak();
  var list=document.getElementById('savedList');
  if(!data.saved.length){list.innerHTML='<div class="empty-state"><div class="e-icon">🌸</div>아직 저장한 명언이 없어.<br>마음에 드는 명언을 저장해봐!</div>';return;}
  list.innerHTML=data.saved.map(function(s){return '<div class="saved-item"><div class="si-text">“'+s.quote+'”</div><div class="si-meta">'+(s.author?'— '+s.author+' · ':'')+s.date+'</div></div>';}).join('');
}
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click',function(){switchTab(btn.dataset.tab);});
});
function switchTab(tab){
  ['home','record','saved'].forEach(function(t){
    var pid='page'+t.charAt(0).toUpperCase()+t.slice(1);
    var tid='tab'+t.charAt(0).toUpperCase()+t.slice(1);
    document.getElementById(pid).classList.toggle('active',t===tab);
    document.getElementById(tid).classList.toggle('active',t===tab);
  });
  if(tab==='record'){calYear=todayDate.getFullYear();calMonth=todayDate.getMonth();renderCalendar();}
  if(tab==='saved') renderSaved();
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
